<title>Mi Horario UA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: app de calendario — barra lateral (mini mes, próximo, filtros, choques) + lienzo semanal a escala; en celular, cabecera compacta, pestañas inferiores y botón flotante. */
:root{
  --bg:#f7f8fa; --panel:#ffffff; --sunken:#f1f2f5; --ink:#14161b; --ink-2:#3d414d; --muted:#6a6f7e; --faint:#a0a5b2; --line:#e5e7ec; --line-2:#eef0f3;
  --accent:#3e63dd; --accent-soft:#edf2fe; --primary:#14161b; --on-primary:#ffffff;
  --cat:#5b5bd6; --cat-soft:#eff0ff; --cat-ink:#3434a0;
  --ase:#12a594; --ase-soft:#e2f7f2; --ase-ink:#0a6b5f;
  --ter:#e08a00; --ter-soft:#fff3dd; --ter-ink:#8a5200;
  --otr:#d6409f; --otr-soft:#fdeef7; --otr-ink:#9a2470;
  --clash:#e5484d; --clash-soft:#feebec; --clash-ink:#b0222b;
  --now:#e5484d;
  --sh-1:0 1px 2px rgba(20,22,27,.05);
  --sh-2:0 1px 2px rgba(20,22,27,.05),0 6px 16px -6px rgba(20,22,27,.12);
  --sh-3:0 12px 40px -8px rgba(20,22,27,.28),0 2px 6px rgba(20,22,27,.08);
  --f-ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-accent:"Instrument Serif",ui-serif,Georgia,serif;
  --hour:60px; --side:288px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0c0f; --panel:#121318; --sunken:#181a20; --ink:#eceef2; --ink-2:#c3c6cf; --muted:#8a8fa0; --faint:#5b6070; --line:#24262e; --line-2:#1b1d23;
  --accent:#7e9bff; --accent-soft:#18203e; --primary:#eceef2; --on-primary:#0b0c0f;
  --cat:#8f90f7; --cat-soft:#1c1d42; --cat-ink:#cfd0ff;
  --ase:#33c9b1; --ase-soft:#0e2d29; --ase-ink:#a6ecde;
  --ter:#f5b647; --ter-soft:#32230a; --ter-ink:#ffdda1;
  --otr:#ee70c2; --otr-soft:#38132f; --otr-ink:#ffc4e7;
  --clash:#ff6369; --clash-soft:#3a1216; --clash-ink:#ffc1c4; --now:#ff6369;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 1px 2px rgba(0,0,0,.4),0 8px 20px -8px rgba(0,0,0,.6); --sh-3:0 16px 48px -8px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.04);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0c0f; --panel:#121318; --sunken:#181a20; --ink:#eceef2; --ink-2:#c3c6cf; --muted:#8a8fa0; --faint:#5b6070; --line:#24262e; --line-2:#1b1d23;
  --accent:#7e9bff; --accent-soft:#18203e; --primary:#eceef2; --on-primary:#0b0c0f;
  --cat:#8f90f7; --cat-soft:#1c1d42; --cat-ink:#cfd0ff;
  --ase:#33c9b1; --ase-soft:#0e2d29; --ase-ink:#a6ecde;
  --ter:#f5b647; --ter-soft:#32230a; --ter-ink:#ffdda1;
  --otr:#ee70c2; --otr-soft:#38132f; --otr-ink:#ffc4e7;
  --clash:#ff6369; --clash-soft:#3a1216; --clash-ink:#ffc1c4; --now:#ff6369;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 1px 2px rgba(0,0,0,.4),0 8px 20px -8px rgba(0,0,0,.6); --sh-3:0 16px 48px -8px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.04);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--panel)}
.spacer{flex:1}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{border-right:1px solid var(--line);background:var(--panel);padding:18px 16px 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto}
.side>*{flex-shrink:0}
.main{min-width:0;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px}
.avatar{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--sunken);font-size:24px;display:grid;place-items:center;transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.avatar:hover{transform:rotate(-10deg) scale(1.08)}
.avatar.pop{animation:pop .55s cubic-bezier(.3,1.7,.5,1)}
.brand b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}

/* mini mes */
.mini{display:grid;gap:8px}
.mini-h{display:flex;align-items:center;justify-content:space-between}
.mini-h b{font-weight:600;font-size:13.5px;text-transform:capitalize}
.mini-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0;text-align:center}
.mini-g .dn{font-size:10.5px;color:var(--faint);font-weight:600;padding:2px 0}
.mini-g button{border:0;background:none;border-radius:8px;height:32px;font-size:12.5px;position:relative;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.mini-g button:hover{background:var(--sunken)}
.mini-g button.out{color:var(--faint)}
.mini-g button.inwk{background:var(--accent-soft);border-radius:0}
.mini-g button.inwk.ws{border-radius:8px 0 0 8px}.mini-g button.inwk.we{border-radius:0 8px 8px 0}
.mini-g button.td{color:#fff;font-weight:700}
.mini-g button.td::before{content:"";position:absolute;inset:4px 6px;border-radius:7px;background:var(--now)}
.mini-g button span{position:relative}
.mini-g button i{position:absolute;left:50%;bottom:3px;width:4px;height:4px;border-radius:50%;transform:translateX(-50%)}

/* próximo */
.up{border:0;text-align:left;background:var(--primary);color:var(--on-primary);border-radius:14px;padding:14px;display:grid;gap:6px;position:relative;overflow:hidden;box-shadow:var(--sh-2);width:100%}
.up .lbl{color:inherit;opacity:.6}
.up .t{font-weight:600;font-size:15.5px;line-height:1.25;letter-spacing:-.01em}
.up .m{font-size:12.5px;opacity:.72}
.up .c::first-letter{text-transform:uppercase}
.up .c{display:block;font-family:var(--f-mono);font-size:24px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.up .bar{height:4px;border-radius:9px;background:color-mix(in srgb,var(--on-primary) 18%,transparent);overflow:hidden}
.up .bar i{display:block;height:100%;background:var(--on-primary)}
.up .pulse{position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--now);animation:pulse 2s infinite}

/* filtros y choques */
.sect{display:grid;gap:6px}
.filt{display:flex;align-items:center;gap:10px;border:0;background:none;width:100%;padding:7px 8px;border-radius:9px;text-align:left;color:var(--ink-2)}
.filt:hover{background:var(--sunken)}
.filt .sw{width:14px;height:14px;border-radius:4px;border:2px solid;flex:none;display:grid;place-items:center;font-size:9px;color:#fff;font-weight:800}
.filt .n{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.filt.off{opacity:.5}.filt.off .sw{background:transparent!important;color:transparent}
.clist{display:grid;gap:6px}
.citem{border:1px solid color-mix(in srgb,var(--clash) 30%,var(--line));background:var(--clash-soft);color:var(--clash-ink);border-radius:10px;padding:8px 10px;text-align:left;display:grid;gap:2px;font-size:12.5px;width:100%}
.citem b{font-weight:600}
.okline{font-size:12.5px;color:var(--ase-ink);background:var(--ase-soft);border-radius:10px;padding:8px 10px}
.side-foot{margin-top:auto;display:grid;gap:8px}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--ase);box-shadow:0 0 0 3px color-mix(in srgb,var(--ase) 20%,transparent)}

/* ---------- top ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);padding:14px max(20px,env(safe-area-inset-right,0px)) 12px 24px;display:grid;gap:12px}
.greet{display:flex;gap:12px;align-items:center;min-width:0}
.greet h1{font-size:26px;line-height:1.1;font-weight:600}
.greet h1 em{font-family:var(--f-accent);font-style:italic;font-weight:400;font-size:1.18em;letter-spacing:0;color:var(--accent)}
.greet p{margin:3px 0 0;color:var(--muted);font-size:13px}
.top-r2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wknav{display:flex;align-items:center;gap:4px}
.wknav .title{font-weight:600;font-size:15px;letter-spacing:-.01em;padding:0 6px;border:0;background:none;border-radius:8px;white-space:nowrap;height:34px}
.wknav .title small{color:var(--muted);font-weight:500;margin-left:6px}
.btn{height:34px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:0 12px;font-weight:500;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--sh-1);transition:background .15s,transform .08s;white-space:nowrap}
.btn:hover{background:var(--sunken)}
.btn:active{transform:scale(.97)}
.btn.ic{width:34px;padding:0;justify-content:center}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.pri:hover{opacity:.88}
.btn.ghost{background:none;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--sunken)}
.btn.danger{color:var(--clash)}
.btn.danger.arm{background:var(--clash);color:#fff;border-color:transparent}
.btn.search{color:var(--muted);min-width:210px;justify-content:flex-start}
.btn.search kbd{margin-left:auto}
.seg{display:inline-flex;background:var(--sunken);border-radius:10px;padding:3px;gap:2px;border:1px solid var(--line-2)}
.seg button{border:0;background:none;height:28px;padding:0 12px;border-radius:7px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--sh-1)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.metrics{display:flex;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow-x:auto;box-shadow:var(--sh-1);scrollbar-width:none}
.metric{flex:1 0 auto;min-width:128px;padding:9px 14px;display:grid;gap:1px;border-right:1px solid var(--line-2)}
.metric:last-child{border-right:0}
.metric b{font-size:17px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metric span{font-size:11.5px;color:var(--muted);white-space:nowrap}

.content{padding:16px max(20px,env(safe-area-inset-right,0px)) 32px 24px;display:grid;gap:14px;min-width:0;align-content:start}
.banner{display:flex;gap:10px;align-items:center;border-radius:11px;padding:9px 12px;font-size:13px;border:1px solid}
.banner.info{background:var(--ter-soft);color:var(--ter-ink);border-color:color-mix(in srgb,var(--ter) 30%,transparent)}
.banner.clash{background:var(--clash-soft);color:var(--clash-ink);border-color:color-mix(in srgb,var(--clash) 30%,transparent)}
.banner>span{min-width:0}
.banner button{margin-left:auto;border:0;background:color-mix(in srgb,currentColor 12%,transparent);color:inherit;border-radius:7px;padding:4px 10px;font-weight:600;white-space:nowrap}

/* ---------- semana ---------- */
.board{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-1);overflow:hidden}
.scroller{overflow:auto;max-height:calc(100vh - 240px);min-height:420px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.grid{display:grid;min-width:720px;position:relative}
.gh{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);border:0;border-radius:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line-2);color:var(--ink);padding:8px 10px 7px;display:grid;gap:4px;cursor:pointer;text-align:left}
.gh.corner{cursor:default;left:0;z-index:7}
.gh .d{display:flex;align-items:baseline;gap:6px}
.gh .d small{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.gh .d b{font-size:20px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.gh.today .d b{color:#fff;background:var(--now);border-radius:8px;padding:0 7px}
.gh .load{height:3px;border-radius:3px;background:var(--line-2);overflow:hidden}
.gh .load i{display:block;height:100%;background:var(--ink-2);opacity:.5;border-radius:3px}
.gh .load.hot i{background:var(--clash);opacity:1}
.gh .hrs{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.times{position:sticky;left:0;z-index:5;background:var(--panel);border-right:1px solid var(--line)}
.times div{position:absolute;right:8px;transform:translateY(-50%);font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.col{position:relative;border-right:1px solid var(--line-2);background-image:linear-gradient(var(--line-2) 1px,transparent 1px);background-size:100% var(--hour)}
.col:last-child{border-right:0}
.col.today{background-color:color-mix(in srgb,var(--accent) 4%,transparent)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:9;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.ev{position:absolute;border:0;text-align:left;border-radius:8px;padding:5px 8px 5px 10px;overflow:hidden;display:flex;flex-direction:column;gap:1px;line-height:1.25;transition:box-shadow .15s,transform .15s;user-select:none;-webkit-user-select:none}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--k)}
.ev:hover{box-shadow:var(--sh-2);z-index:8}
.ev>*{flex:none}
.ev .t{font-weight:600;font-size:12.5px;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis}
.ev .h{font-family:var(--f-mono);font-size:10.5px;opacity:.8;white-space:nowrap}
.ev .p{font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.compact{flex-direction:row;align-items:center;gap:6px;padding-top:2px;padding-bottom:2px}
.ev.compact .t{white-space:nowrap}
.ev .rz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.ev.dragging{box-shadow:var(--sh-3);z-index:20;opacity:.95;cursor:grabbing;transition:none}
.ev.ghost{background:var(--accent-soft);color:var(--accent);outline:1.5px dashed var(--accent);outline-offset:-1.5px;pointer-events:none}
.ev.ghost::before{display:none}
@media (hover:hover) and (pointer:fine){.ev{cursor:grab}.col{cursor:crosshair}}
.kc{--k:var(--cat);background:var(--cat-soft);color:var(--cat-ink)}
.ka{--k:var(--ase);background:var(--ase-soft);color:var(--ase-ink)}
.kt{--k:var(--ter);background:var(--ter-soft);color:var(--ter-ink)}
.ko{--k:var(--otr);background:var(--otr-soft);color:var(--otr-ink)}
.ev.is-clash{--k:var(--clash);background:repeating-linear-gradient(135deg,var(--clash-soft) 0 7px,color-mix(in srgb,var(--clash-soft) 55%,var(--panel)) 7px 14px);color:var(--clash-ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--clash) 55%,transparent)}
.ev.is-clash{padding-right:22px}
.badge{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:5px;background:var(--clash);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800}

/* ---------- día / agenda ---------- */
.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.daystrip button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 0 7px;display:grid;justify-items:center;gap:2px;position:relative;box-shadow:var(--sh-1)}
.daystrip small{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.daystrip b{font-size:18px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.daystrip button[aria-pressed="true"]{background:var(--primary);border-color:transparent;color:var(--on-primary)}
.daystrip button[aria-pressed="true"] small{color:inherit;opacity:.65}
.daystrip .dots{display:flex;gap:3px;height:5px}
.daystrip .dots i{width:5px;height:5px;border-radius:50%}
.daystrip .tdot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--now)}
.dayhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dayhead h2{font-size:22px}
.dayhead span{color:var(--muted);font-size:13px}
.tl{display:grid;gap:8px}
.item{--k:var(--otr);width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:13px;padding:12px 14px 12px 18px;display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:start;text-align:left;position:relative;overflow:hidden;box-shadow:var(--sh-1);transition:box-shadow .15s,transform .15s}
.item:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k)}
.item.kc{--k:var(--cat)}.item.ka{--k:var(--ase)}.item.kt{--k:var(--ter)}
.item.is-clash{--k:var(--clash);background:repeating-linear-gradient(135deg,var(--clash-soft) 0 9px,color-mix(in srgb,var(--clash-soft) 55%,var(--panel)) 9px 18px);border-color:color-mix(in srgb,var(--clash) 40%,var(--line))}
.item .tm{font-family:var(--f-mono);font-size:14px;font-weight:600;line-height:1.3}
.item .tm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.item .ti{font-weight:600;font-size:15px;letter-spacing:-.01em;line-height:1.3}
.item .meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;color:var(--muted);font-size:12.5px}
.item .meta span{display:inline-flex;align-items:center;gap:5px}
.item .meta svg{width:14px;height:14px}
.item.live{border-color:var(--now);box-shadow:0 0 0 3px color-mix(in srgb,var(--now) 18%,transparent)}
.item.past{opacity:.5}
.item .chev{color:var(--faint);align-self:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.k{background:color-mix(in srgb,var(--k) 14%,transparent);color:var(--k)}
.chip.red{background:var(--clash);color:#fff}
.chip.live{background:var(--now);color:#fff}
.free{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;padding-left:18px}
.free::after{content:"";flex:1;border-top:1px dashed var(--line)}
.agenda{display:grid;gap:20px}
.agenda h3{font-size:13px;font-weight:500;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.agenda h3 b{color:var(--ink);font-weight:600;font-size:15px}
.empty{border:1px dashed var(--line);border-radius:14px;padding:36px 18px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center;background:var(--panel)}
.empty .e{font-size:34px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,9,12,.42);animation:fade .18s}
.drawer{position:fixed;z-index:51;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--sh-3);display:flex;flex-direction:column;animation:slide .26s cubic-bezier(.2,.9,.25,1);padding-top:env(safe-area-inset-top,0px)}
.dr-h{display:flex;align-items:center;gap:8px;padding:14px max(18px,env(safe-area-inset-right,0px)) 12px 20px;border-bottom:1px solid var(--line-2)}
.dr-h h2{font-size:15px;flex:1}
.dr-b{padding:20px max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 20px;overflow:auto;display:grid;gap:18px;align-content:start;grid-auto-rows:max-content;flex:1;min-height:0}
.dt-title{font-size:24px;line-height:1.15;font-weight:600;letter-spacing:-.025em}
.rows{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rowi{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 12px;align-items:start;font-size:13.5px}
.rowi+.rowi{border-top:1px solid var(--line-2)}
.rowi svg{margin-top:2px;color:var(--muted)}
.rowi small{display:block;color:var(--muted);font-size:12px}
.people{display:grid;gap:8px}
.person{display:flex;align-items:center;gap:10px;font-size:13.5px}
.ini{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--sunken);color:var(--ink-2);flex:none}
.warnbox{border-radius:12px;padding:11px 12px;background:var(--clash-soft);color:var(--clash-ink);font-size:13px;display:grid;gap:4px;border:1px solid color-mix(in srgb,var(--clash) 30%,transparent)}
.warnbox b{display:flex;gap:6px;align-items:center}
.dr-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.f{display:grid;gap:5px;font-size:12px;font-weight:500;color:var(--muted);min-width:0}
.f input,.f select,.f textarea{height:36px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:0 10px;color:var(--ink);font-size:14px;width:100%;min-width:0;box-shadow:var(--sh-1);transition:border-color .15s,box-shadow .15s}
.f textarea{height:auto;min-height:88px;padding:8px 10px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.kinds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kinds label{border:1px solid var(--line);border-radius:10px;padding:8px 4px;display:grid;justify-items:center;gap:5px;font-size:12px;font-weight:500;cursor:pointer;text-align:center;position:relative}
.kinds input{position:absolute;opacity:0;pointer-events:none}
.kinds label:has(input:checked){border-color:var(--k);background:color-mix(in srgb,var(--k) 10%,transparent);color:var(--k);font-weight:600}
.kinds label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.kinds i{width:10px;height:10px;border-radius:3px;background:var(--k)}
.card{border:1px solid var(--line);border-radius:13px;padding:14px;display:grid;gap:10px}
.card h3{font-size:14px;display:flex;gap:7px;align-items:center}
.card p{margin:0;color:var(--muted);font-size:13px}
.emojis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.emojis button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--sunken);font-size:21px;max-width:100%}
.emojis button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px}
.tog input{appearance:none;-webkit-appearance:none;width:36px;height:21px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;cursor:pointer;flex:none;margin:0}
.tog input::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:var(--sh-1);transition:transform .2s}
.tog input:checked{background:var(--ase)}
.tog input:checked::after{transform:translateX(15px)}
.preview{display:grid;gap:4px;max-height:240px;overflow:auto}
.preview div{font-size:12.5px;background:var(--panel);border-radius:7px;padding:6px 9px;display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:3px;flex:none;background:var(--k)}

/* ---------- paleta ⌘K ---------- */
.pal{position:fixed;z-index:61;left:50%;top:max(12vh,calc(env(safe-area-inset-top,0px) + 16px));transform:translateX(-50%);width:min(600px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-3);overflow:hidden;animation:popin .18s cubic-bezier(.2,.9,.25,1)}
.pal-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2);color:var(--muted)}
.pal-in input{border:0;background:none;outline:0;flex:1;font-size:16px;min-width:0;color:var(--ink)}
.pal-l{max-height:min(420px,60vh);overflow:auto;padding:6px}
.pal-g{font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:8px 10px 4px}
.pal-i{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:0;background:none;width:100%;text-align:left;font-size:14px}
.pal-i>span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-i small{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.pal-i[aria-selected="true"]{background:var(--sunken)}
.pal-f{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted);flex-wrap:wrap}

/* ---------- toasts ---------- */
.toasts{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;width:min(420px,calc(100% - 32px))}
.toast{background:var(--primary);color:var(--on-primary);border-radius:12px;padding:10px 10px 10px 14px;box-shadow:var(--sh-3);display:flex;gap:10px;align-items:center;animation:up .28s cubic-bezier(.2,.9,.25,1);font-size:13.5px}
.toast .tx{min-width:0;flex:1}
.toast b{display:block;font-weight:600}
.toast .tx span{opacity:.72;font-size:12.5px}
.toast button{border:0;background:color-mix(in srgb,var(--on-primary) 14%,transparent);color:inherit;border-radius:7px;padding:5px 10px;font-weight:600;white-space:nowrap}
.toast .x{background:none;opacity:.6;padding:4px;display:grid}

/* ---------- estados, traslados, supervisión ---------- */
.ev.off{--k:var(--faint);background:repeating-linear-gradient(135deg,var(--sunken) 0 6px,var(--panel) 6px 12px);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.ev.off .t,.item.off .ti{text-decoration:line-through;text-decoration-thickness:1.5px}
.item.off{opacity:.6}
.item.done .tm::after{content:"✓";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ase);color:#fff;font-size:11px;margin-top:6px}
.hol{font-size:10.5px;font-weight:600;color:var(--clash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.free.tight{color:var(--ter-ink);font-weight:600}
.free.tight::after{border-color:color-mix(in srgb,var(--ter) 55%,transparent)}
.titem{border:1px solid color-mix(in srgb,var(--ter) 30%,var(--line));background:var(--ter-soft);color:var(--ter-ink);border-radius:10px;padding:8px 10px;text-align:left;display:grid;gap:2px;font-size:12.5px;width:100%}
.titem b{font-weight:600}
.prog{display:grid;gap:6px}
.prog .bar{height:5px;border-radius:9px;background:var(--line-2);overflow:hidden;display:flex}
.prog .bar i{display:block;height:100%;background:var(--accent)}
.prog .bar i.g{background:var(--ase)}
.prog small{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.prog .btn{height:30px;font-size:12.5px;justify-self:start}
.sess{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.sess h3{font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.sess h3 small{color:var(--muted);font-weight:500;font-size:12px}
.att{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13.5px;cursor:pointer}
.att input{width:18px;height:18px;accent-color:var(--ase);flex:none;margin:0}
.att small{display:block;color:var(--muted);font-size:11.5px;word-break:break-all}
.seg.full{display:grid;grid-template-columns:repeat(3,1fr)}
.seg button[data-st="realizada"][aria-pressed="true"]{color:var(--ase-ink);background:var(--ase-soft)}
.seg button[data-st="suspendida"][aria-pressed="true"]{color:var(--clash-ink);background:var(--clash-soft)}
.warnbox .dr-actions{margin-top:6px}
.warnbox .btn{height:30px;font-size:12.5px;color:var(--ink)}
.infobox{border-radius:12px;padding:11px 12px;background:var(--ter-soft);color:var(--ter-ink);font-size:13px;display:grid;gap:4px;border:1px solid color-mix(in srgb,var(--ter) 30%,transparent)}
.mob-up{display:none}
a.btn{text-decoration:none;color:inherit}

/* ---------- móvil ---------- */
.mobile-only{display:none}
.tabs,.fab{display:none}
@media (max-width:1023px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mobile-only{display:grid}
  .top{padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:10px}
  .content{padding:14px max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .greet h1{font-size:21px}
  .btn.search{min-width:0;width:34px;padding:0;justify-content:center}
  .btn.search .st,.btn.search kbd,.hide-m{display:none}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;z-index:25;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabs button{border:0;background:none;display:grid;justify-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:500;color:var(--muted);border-radius:10px}
  .tabs button svg{width:21px;height:21px}
  .tabs button[aria-pressed="true"]{color:var(--ink)}
  .tabs button[aria-pressed="true"] svg{stroke-width:2.3}
  .fab{display:grid;place-items:center;position:fixed;z-index:26;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:17px;border:0;background:var(--primary);color:var(--on-primary);box-shadow:var(--sh-3)}
  .fab svg{width:24px;height:24px;stroke-width:2.2}
  .toasts{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .scroller{max-height:calc(100vh - 300px)}
  .drawer{top:auto;left:0;width:100%;max-height:92vh;border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;animation:sheet .3s cubic-bezier(.2,.9,.25,1);padding-top:0}
  .drawer::before{content:"";width:38px;height:4px;border-radius:9px;background:var(--line);margin:8px auto 0;flex:none}
  .mob-up{display:grid}
}
@media (max-width:720px){
  #wgrid{min-width:0;--tc:40px;--cw:0px}
  .gh{padding:6px 2px 5px;justify-items:center;text-align:center}
  .gh .d{flex-direction:column;gap:0;align-items:center}
  .gh .d b{font-size:17px}
  .gh .hrs{font-size:9.5px}
  .gh .load,.gh .hol{display:none}
  .times div{font-size:9.5px;right:4px}
  .ev{padding:3px 3px 3px 6px;border-radius:6px}
  .ev .t{font-size:10.5px;white-space:normal;line-height:1.15;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
  .ev .h{font-size:9px}
  .ev .p{display:none}
  .ev.compact{flex-direction:column;align-items:flex-start;gap:0}
  .ev.is-clash{padding-right:3px}
  .badge{width:12px;height:12px;font-size:8px;top:2px;right:2px;border-radius:4px}
}
@media (max-width:560px){
  .form{grid-template-columns:minmax(0,1fr)}
  .item{grid-template-columns:56px minmax(0,1fr);gap:10px;padding-left:16px}
  .item .chev{display:none}
  .metric{min-width:108px;padding:8px 12px}
  .top-r2 .seg{display:none}
  .wknav .title{font-size:14px}
  .wknav .title small{display:none}
  .emojis{grid-template-columns:repeat(6,minmax(0,1fr))}
  .daystrip{gap:4px}
}

@keyframes up{from{transform:translateY(12px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:0}}

@keyframes popin{from{transform:translate(-50%,-8px) scale(.98);opacity:0}}

::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}

<div id="layer"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
const DAYS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DSH=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MSH=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const KINDS={catedra:'Clase',asesoria:'Asesoría',terreno:'Terreno',otro:'Otro'};
const KPLURAL={catedra:'Clases',asesoria:'Asesorías de práctica',terreno:'Terrenos',otro:'Otros'};
const KCLS={catedra:'kc',asesoria:'ka',terreno:'kt',otro:'ko'};
const KVAR={catedra:'var(--cat)',asesoria:'var(--ase)',terreno:'var(--ter)',otro:'var(--otr)'};
const EMOJIS=['🦉','🧠','🌱','☕','🚀','🐙','🦊','📚','✨','🐢','🎧','🌈','🦄','🐝','🌻','🧉'];
const DEFAULT_PROFILE={name:'Sebastián',emoji:'🦉',semStart:'2026-08-10',semEnd:'2026-12-11',notify20:true,notifyEve:true};
const HOLIDAYS={'2026-09-18':'Independencia Nacional','2026-09-19':'Glorias del Ejército','2026-10-12':'Encuentro de Dos Mundos','2026-10-31':'Iglesias Evangélicas','2026-11-01':'Todos los Santos','2026-12-08':'Inmaculada Concepción','2026-12-25':'Navidad','2027-01-01':'Año Nuevo','2027-03-26':'Viernes Santo','2027-03-27':'Sábado Santo','2027-05-01':'Día del Trabajo','2027-05-21':'Glorias Navales','2027-06-21':'Pueblos Indígenas','2027-06-28':'San Pedro y San Pablo','2027-07-16':'Virgen del Carmen','2027-08-15':'Asunción de la Virgen','2027-09-17':'Feriado Fiestas Patrias','2027-09-18':'Independencia Nacional','2027-09-19':'Glorias del Ejército','2027-10-11':'Encuentro de Dos Mundos','2027-10-31':'Iglesias Evangélicas','2027-11-01':'Todos los Santos','2027-12-08':'Inmaculada Concepción','2027-12-25':'Navidad'};
const TIGHT=45; // minutos mínimos para trasladarse a/desde un terreno
const LS='horarioUA.v1';
const mq=matchMedia('(max-width:1023px)');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

const S={profile:{...DEFAULT_PROFILE},events:[],loaded:false,
  view:matchMedia('(max-width:720px)').matches?'dia':'semana',
  week:mondayOf(new Date()),sel:startOfDay(new Date()),mini:startOfDay(new Date()),
  hidden:new Set(lsGet(LS+'.hidden',[])),sessions:{},detail:null,db:null,mode:'local',grid:null,drag:null,syncOn:false,syncMsg:'Conectando…'};

/* ---------- tiempo ---------- */
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function mondayOf(d){const x=startOfDay(d);return addDays(x,-((x.getDay()+6)%7))}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseYmd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function toMin(t){if(!t)return 0;const[h,m]=String(t).split(':').map(Number);return h*60+(m||0)}
function fmtMin(m){m=Math.max(0,Math.min(1439,m));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function dur(m){const h=Math.floor(m/60),r=m%60;return h&&r?`${h} h ${r} min`:h?`${h} h`:`${r} min`}
function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes()}
function sameDay(a,b){return ymd(a)===ymd(b)}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function sd(d){return d.getDate()+' '+MSH[d.getMonth()]}
function dowOf(d){return d.getDay()===0?7:d.getDay()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function ico(n){return `<svg class="i"><use href="#i-${n}"/></svg>`}
function initials(n){const p=String(n).trim().split(/\s+/);return(((p[0]||'')[0]||'')+((p.length>2?p[p.length-2]:p[1]||'')[0]||'')).toUpperCase()}

/* ---------- datos ---------- */
function occursOn(e,date){
  if(!e.day||Number(e.day)!==dowOf(date))return false;
  const k=ymd(date);return !(e.dateFrom&&k<e.dateFrom)&&!(e.dateTo&&k>e.dateTo);
}
function eventsOn(date,all){return S.events.filter(e=>occursOn(e,date)&&(all||!S.hidden.has(e.kind||'otro'))).sort((a,b)=>toMin(a.start)-toMin(b.start)||toMin(a.end)-toMin(b.end))}
function skey(id,date){return id+'__'+ymd(date)}
function sessOf(id,date){return S.sessions[skey(id,date)]||null}
function stateOf(e,date){if(HOLIDAYS[ymd(date)])return 'feriado';const s=sessOf(e.id,date);return s&&s.status==='suspendida'?'suspendida':'ok'}
function activeOn(date){return eventsOn(date,true).filter(e=>stateOf(e,date)==='ok')}
function clashesOn(date){
  const l=activeOn(date),ids=new Set(),pairs=[];
  for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++){const a=l[i],b=l[j];const ov=Math.min(toMin(a.end),toMin(b.end))-Math.max(toMin(a.start),toMin(b.start));if(ov>0){ids.add(a.id);ids.add(b.id);pairs.push({a,b,ov,date})}}
  return{ids,pairs};
}
function tightOn(date){
  const l=activeOn(date),out=[];let prev=null;
  l.forEach(b=>{if(prev){const g=toMin(b.start)-toMin(prev.end);if(g>=0&&g<TIGHT&&(prev.place||'')!==(b.place||'')&&(prev.kind==='terreno'||b.kind==='terreno'))out.push({a:prev,b,g,date})}if(!prev||toMin(b.end)>toMin(prev.end))prev=b});
  return out;
}
function terrenoSessions(){
  const out=[],t=startOfDay(new Date());
  S.events.filter(e=>e.kind==='terreno'&&e.day&&e.dateFrom&&e.dateTo).forEach(e=>{
    for(let d=parseYmd(e.dateFrom);ymd(d)<=e.dateTo;d=addDays(d,1))if(occursOn(e,d)&&!HOLIDAYS[ymd(d)]){const s=sessOf(e.id,d);out.push({e,d,s,past:d<t||(sameDay(d,t)&&toMin(e.end)<=nowMin())})}
  });
  return out.sort((a,b)=>a.d-b.d||toMin(a.e.start)-toMin(b.e.start));
}
function gcalURL(e){
  const first=nextOccurrence(e)||(e.dateFrom?parseYmd(e.dateFrom):null);if(!first)return null;
  const f=(d,m)=>ymd(d).replace(/-/g,'')+'T'+fmtMin(m).replace(':','')+'00';
  const until=(e.dateTo||S.profile.semEnd||'').replace(/-/g,'');
  const q=new URLSearchParams({action:'TEMPLATE',text:e.title,dates:f(first,toMin(e.start))+'/'+f(first,toMin(e.end)),ctz:'America/Santiago',location:e.place||'',details:[KINDS[e.kind],e.group,e.note].filter(Boolean).join(' · ')});
  if(until)q.set('recur','RRULE:FREQ=WEEKLY;UNTIL='+until+'T235959Z');
  return 'https://calendar.google.com/calendar/render?'+q.toString();
}
function weekDays(){return Array.from({length:7},(_,i)=>addDays(S.week,i))}
function layoutDay(list){
  const out=[];let cl=[],end=-1;
  const flush=()=>{const cols=[];cl.forEach(e=>{let c=cols.findIndex(x=>x<=toMin(e.start));if(c<0){c=cols.length;cols.push(0)}cols[c]=toMin(e.end);e._c=c});cl.forEach(e=>{e._n=cols.length;out.push(e)});cl=[]};
  list.forEach(e=>{if(cl.length&&toMin(e.start)>=end){flush();end=-1}cl.push({...e});end=Math.max(end,toMin(e.end))});
  if(cl.length)flush();return out;
}
function nextOccurrence(e){
  if(!e.day)return null;const nm=nowMin(),t=startOfDay(new Date());
  for(let i=0;i<120;i++){const d=addDays(t,i);if(occursOn(e,d)&&(i>0||toMin(e.end)>nm))return d}
  return null;
}
function findNext(){
  const n=new Date(),nm=nowMin();
  for(let i=0;i<21;i++){const d=addDays(startOfDay(n),i);const l=activeOn(d).filter(e=>i>0||toMin(e.start)>nm);if(l.length){const at=new Date(d);at.setMinutes(toMin(l[0].start));return{ev:l[0],at}}}
  return null;
}

/* ---------- persistencia ---------- */
function lsGet(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function clean(e){const o={};for(const k of['title','kind','day','start','end','place','dateFrom','dateTo','group','people','emails','note','estEnd'])if(e[k]!==undefined&&e[k]!==''&&e[k]!==null&&!(Array.isArray(e[k])&&!e[k].length))o[k]=e[k];o.day=Number(o.day||0);o.kind=o.kind||'otro';return o}
function persistLocal(){lsSet(LS,{profile:S.profile,events:S.events,sessions:S.sessions})}
async function saveSession(key,data){
  S.sessions[key]={...data};render();
  if(S.mode==='db'){try{await S.db.collection('sessions').doc(key).set(S.sessions[key])}catch{toast('No se pudo guardar la sesión','Inténtalo otra vez.')}}
  else persistLocal();
}
async function saveEvent(ev){
  const id=ev.id||uid(),body=clean(ev),i=S.events.findIndex(x=>x.id===id);
  if(i>=0)S.events[i]={id,...body};else S.events.push({id,...body});
  render();
  if(S.mode==='db'){try{await S.db.collection('events').doc(id).set(body)}catch{toast('No se pudo guardar','Revisa tu conexión e inténtalo otra vez.')}}
  else persistLocal();
  return id;
}
async function deleteEvent(id){
  S.events=S.events.filter(e=>e.id!==id);render();
  if(S.mode==='db'){try{await S.db.collection('events').doc(id).delete()}catch{toast('No se pudo eliminar','Inténtalo otra vez.')}}
  else persistLocal();
}
async function saveProfile(p){
  S.profile={...S.profile,...p};render();
  if(S.mode==='db'){try{await S.db.doc('config/profile').set(S.profile)}catch{}}else persistLocal();
}
function setSync(on,msg){S.syncOn=on;S.syncMsg=msg||(on?'Sincronizado · PC y celular':'Guardado solo en este dispositivo');renderSide()}

async function boot(){
  const local=lsGet(LS,null);
  if(local){S.profile={...DEFAULT_PROFILE,...local.profile};S.events=local.events||[];S.sessions=local.sessions||{};S.loaded=true}
  render();
  let db=null;try{db=window.claude?.use?await window.claude.use('db'):null}catch{db=null}
  if(!db){S.loaded=true;setSync(false);render();return}
  S.db=db;S.mode='db';setSync(true);
  db.collection('events').onSnapshot(snap=>{S.events=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded=true;if(!S.drag)render()},()=>setSync(false,'Sin conexión con la nube'));
  db.collection('sessions').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>m[d.id]=d.data());S.sessions=m;if(!S.drag)render()},()=>{});
  db.doc('config/profile').onSnapshot(snap=>{if(snap.exists){S.profile={...DEFAULT_PROFILE,...snap.data()};if(!S.drag)render()}},()=>{});
}

/* ---------- render ---------- */
function go(fn){S.keepScroll=false;const run=()=>{fn();render()};if(document.startViewTransition&&!reduced)document.startViewTransition(run);else run()}
function render(){
  const sc=document.getElementById('scroller');
  const keep=sc&&S.keepScroll!==false&&S.view==='semana'&&S._wk===ymd(S.week)?sc.scrollTop:null;
  S.keepScroll=true;
  renderSide();renderTop();renderMetrics();
  const c=document.getElementById('content');
  if(!S.loaded){c.innerHTML='<div class="empty"><div class="e">⏳</div>Cargando tu horario…</div>';return}
  if(!S.events.length){c.innerHTML=`<div class="empty"><div class="e">${esc(S.profile.emoji)}</div><b style="color:var(--ink)">Tu horario está vacío</b><span>Crea tu primer bloque o deja que Claude ordene tu horario desde Ajustes → Nuevo semestre.</span><div class="dr-actions" style="justify-content:center"><button class="btn pri" data-act="new">${ico('plus')}Nuevo bloque</button><button class="btn" data-act="settings">${ico('spark')}Nuevo semestre</button></div></div>`;return}
  let html=banners();
  html+=S.view==='semana'?weekHTML():S.view==='dia'?dayHTML():agendaHTML();
  c.innerHTML=html;
  if(S.view==='semana'){S._wk=ymd(S.week);afterWeek(keep)}else S._wk=null;
}

function renderSide(){
  const side=document.getElementById('side'),p=S.profile;
  const wc=[],wt=[];weekDays().forEach(d=>{wc.push(...clashesOn(d).pairs);wt.push(...tightOn(d))});
  side.innerHTML=`
  <div class="brand"><button class="avatar" id="avatar" aria-label="Cambiar emoji" title="Cambiar emoji">${esc(p.emoji||'🦉')}</button><div><b>${esc(p.name||'Mi horario')}</b><span>Semestre ${semLabel()} · U. Autónoma</span></div></div>
  ${semProgHTML()}
  ${upHTML()}
  ${miniHTML()}
  <div class="sect"><div class="lbl" style="padding:0 8px 2px">Calendarios</div>${filtersHTML(true)}</div>
  <div class="sect"><div class="lbl" style="padding:0 8px 2px">Choques esta semana</div>
    ${wc.length?`<div class="clist">${wc.map(c=>`<button class="citem" data-open="${esc(c.b.id)}" data-date="${ymd(c.date)}"><b>${DSH[c.date.getDay()]} ${sd(c.date)} · ${dur(c.ov)} superpuestos</b><span>${esc(c.a.title)} ↔ ${esc(c.b.title)}</span></button>`).join('')}</div>`:`<div class="okline">Sin choques esta semana 👌</div>`}
  </div>
  ${wt.length?`<div class="sect"><div class="lbl" style="padding:0 8px 2px">Traslados ajustados</div><div class="clist">${wt.map(t=>`<button class="titem" data-open="${esc(t.b.id)}" data-date="${ymd(t.date)}"><b>${DSH[t.date.getDay()]} ${sd(t.date)} · ${t.g} min para llegar</b><span>${esc(t.a.place||t.a.title)} → ${esc(t.b.place||t.b.title)} (${esc(t.b.start)})</span></button>`).join('')}</div></div>`:''}
  ${supHTML()}
  <div class="side-foot"><span class="sync${S.syncOn?' on':''}"><i></i>${esc(S.syncMsg)}</span><span style="font-size:11.5px;color:var(--faint);line-height:1.9"><kbd>N</kbd> nuevo · <kbd>T</kbd> hoy · <kbd>←</kbd><kbd>→</kbd> semana · <kbd>⌘K</kbd> buscar</span></div>`;
}
function semProgHTML(){
  const p=S.profile;if(!p.semStart||!p.semEnd)return '';
  const a=parseYmd(p.semStart),b=parseYmd(p.semEnd),t=startOfDay(new Date());
  const total=Math.max(1,Math.ceil((b-a)/(7*864e5))),cur=Math.max(0,Math.min(total,Math.floor((t-a)/(7*864e5))+1));
  const left=Math.max(0,Math.ceil((b-t)/(7*864e5)));
  return `<div class="prog"><small><span>Semana ${cur} de ${total}</span><span>${t>b?'Semestre terminado':left===1?'Queda 1 semana':`Quedan ${left} semanas`}</span></small><div class="bar"><i style="width:${cur/total*100}%"></i></div></div>`;
}
function supHTML(){
  const l=terrenoSessions();if(!l.length)return '';
  const done=l.filter(x=>x.s&&x.s.status==='realizada').length,sus=l.filter(x=>x.s&&x.s.status==='suspendida').length,pend=l.filter(x=>x.past&&!x.s);
  return `<div class="sect"><div class="lbl" style="padding:0 8px 2px">Supervisión de terrenos</div><div class="prog" style="padding:0 8px"><small><span><b style="color:var(--ink)">${done}</b> de ${l.length} sesiones realizadas</span>${sus?`<span>${sus} suspendidas</span>`:''}</small><div class="bar"><i class="g" style="width:${done/l.length*100}%"></i></div>${pend.length?`<button class="btn" data-open="${esc(pend[0].e.id)}" data-date="${ymd(pend[0].d)}">Registrar ${pend.length} ${pend.length===1?'sesión pasada':'sesiones pasadas'}</button>`:`<small>Registra asistencia y bitácora desde cada terreno.</small>`}</div></div>`;
}
function filtersHTML(withCount){
  const counts={catedra:0,asesoria:0,terreno:0,otro:0};S.events.forEach(e=>counts[e.kind]!==undefined?counts[e.kind]++:counts.otro++);
  return Object.keys(KINDS).map(k=>`<button class="filt${S.hidden.has(k)?' off':''}" data-filter="${k}" aria-pressed="${!S.hidden.has(k)}"><span class="sw" style="border-color:${KVAR[k]};background:${KVAR[k]}">✓</span>${KPLURAL[k]}${withCount?`<span class="n">${counts[k]}</span>`:''}</button>`).join('');
}
function semLabel(){const s=S.profile.semStart?parseYmd(S.profile.semStart):new Date();return s.getFullYear()+'-'+(s.getMonth()<6?1:2)}

function upHTML(){
  const n=new Date(),nm=nowMin(),live=activeOn(n).find(e=>toMin(e.start)<=nm&&toMin(e.end)>nm);
  if(live){const pct=Math.round((nm-toMin(live.start))/(toMin(live.end)-toMin(live.start))*100);
    return `<button class="up" data-open="${esc(live.id)}" data-date="${ymd(n)}"><span class="pulse"></span><div class="lbl">En curso</div><div class="t">${esc(live.title)}</div><div class="m">${esc(live.place||'Sin sala')} · hasta las ${esc(live.end)}</div><div class="c">${dur(toMin(live.end)-nm)}</div><div class="bar"><i style="width:${pct}%"></i></div></button>`}
  const nx=findNext();
  if(!nx)return `<div class="up"><div class="lbl">Lo próximo</div><div class="t">Nada en las próximas 3 semanas</div><div class="m">Disfruta el respiro ${esc(S.profile.emoji||'')}</div></div>`;
  const mins=Math.round((nx.at-n)/60000);
  const when=mins<60?`en ${mins} min`:mins<60*12?`en ${dur(Math.round(mins/5)*5)}`:sameDay(nx.at,n)?`hoy ${nx.ev.start}`:sameDay(nx.at,addDays(n,1))?'mañana':`${DAYS[nx.at.getDay()].toLowerCase()} ${sd(nx.at)}`;
  return `<button class="up" data-open="${esc(nx.ev.id)}" data-date="${ymd(nx.at)}"><div class="lbl">Lo próximo</div><div class="t">${esc(nx.ev.title)}</div><div class="m">${DSH[nx.at.getDay()]} ${esc(nx.ev.start)}–${esc(nx.ev.end)} · ${esc(nx.ev.place||'Sin sala')}</div><div class="c">${when}</div></button>`;
}

function miniHTML(){
  const m=new Date(S.mini.getFullYear(),S.mini.getMonth(),1),start=mondayOf(m),today=new Date(),wk=ymd(S.week),wkEnd=ymd(addDays(S.week,6));
  const last=new Date(m.getFullYear(),m.getMonth()+1,0),rows=Math.ceil((((m.getDay()+6)%7)+last.getDate())/7);
  let cells='';
  for(let i=0;i<rows*7;i++){
    const d=addDays(start,i),k=ymd(d),inWk=k>=wk&&k<=wkEnd,l=eventsOn(d,true),cl=clashesOn(d).pairs.length;
    const dot=l.length?`<i style="background:${cl?'var(--clash)':l.some(e=>e.kind==='terreno')?'var(--ter)':'var(--faint)'}"></i>`:'';
    cells+=`<button data-pick="${k}" aria-label="${d.getDate()} de ${MONTHS[d.getMonth()]}" class="${d.getMonth()!==m.getMonth()?'out ':''}${inWk?'inwk ':''}${inWk&&i%7===0?'ws ':''}${inWk&&i%7===6?'we ':''}${sameDay(d,today)?'td':''}"><span>${d.getDate()}</span>${dot}</button>`;
  }
  return `<div class="mini"><div class="mini-h"><b>${MONTHS[m.getMonth()]} ${m.getFullYear()}</b><span><button class="btn ghost ic" data-mini="-1" aria-label="Mes anterior">${ico('l')}</button><button class="btn ghost ic" data-mini="1" aria-label="Mes siguiente">${ico('r')}</button></span></div><div class="mini-g">${['L','M','M','J','V','S','D'].map(x=>`<span class="dn">${x}</span>`).join('')}${cells}</div></div>`;
}

function renderTop(){
  const p=S.profile,n=new Date(),h=n.getHours();
  const sal=h<12?'Buenos días':h<20?'Buenas tardes':'Buenas noches';
  document.getElementById('avatar-m').textContent=p.emoji||'🦉';
  document.getElementById('eyebrow').textContent=`${DAYS[n.getDay()]} ${n.getDate()} de ${MONTHS[n.getMonth()]} · Semana ${isoWeek(n)}`;
  document.getElementById('greet').innerHTML=`${sal}, <em>${esc((p.name||'profe').split(' ')[0])}</em>`;
  const today=activeOn(n),nm=nowMin(),left=today.filter(e=>toMin(e.end)>nm);
  document.getElementById('greet-sub').textContent=!S.events.length?'Arma tu semana en segundos.':left.length?`Hoy te ${left.length===1?'queda 1 bloque':'quedan '+left.length+' bloques'}. Sigue: ${left[0].title} a las ${left[0].start}.`:today.length?'Terminaste por hoy. Buen trabajo 🎉':'Hoy no tienes bloques agendados.';
  const end=addDays(S.week,6),same=S.week.getMonth()===end.getMonth();
  document.getElementById('wktitle').innerHTML=`${same?S.week.getDate():sd(S.week)} – ${sd(end)} ${end.getFullYear()}<small>Semana ${isoWeek(S.week)}</small>`;
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===S.view));
}

function renderMetrics(){
  const days=weekDays();let mins=0,blocks=0,ter=0,cl=0,ov=0,tight=0;
  const per=days.map(d=>{const l=activeOn(d);let m=0;l.forEach(e=>{m+=toMin(e.end)-toMin(e.start);if(e.kind==='terreno')ter++});blocks+=l.length;mins+=m;clashesOn(d).pairs.forEach(x=>{cl++;ov+=x.ov});tight+=tightOn(d).length;return[d,m]});
  const busy=per.slice().sort((a,b)=>b[1]-a[1])[0],hol=days.filter(d=>HOLIDAYS[ymd(d)]&&(dowOf(d)<=5||eventsOn(d,true).length));
  document.getElementById('metrics').innerHTML=`
    <div class="metric"><b>${(mins/60).toFixed(1).replace('.',',')} h</b><span>Carga semanal</span></div>
    <div class="metric"><b>${blocks}</b><span>Bloques</span></div>
    <div class="metric"><b style="color:var(--ter)">${ter}</b><span>Terrenos</span></div>
    <div class="metric"><b style="color:${cl?'var(--clash)':'var(--ase)'}">${cl}</b><span>${cl?'Choques · '+dur(ov):'Choques'}</span></div>
    <div class="metric"><b style="color:${tight?'var(--ter)':'var(--ase)'}">${tight}</b><span>Traslados ajustados</span></div>
    <div class="metric"><b>${busy&&busy[1]?DAYS[busy[0].getDay()]:'—'}</b><span>Día más cargado${busy&&busy[1]?' · '+dur(busy[1]):''}</span></div>
    ${hol.length?`<div class="metric"><b style="color:var(--clash)">${hol.length}</b><span>${hol.length===1?'Feriado':'Feriados'} · ${hol.map(d=>DSH[d.getDay()]).join(', ')}</span></div>`:''}`;
}
function banners(){
  let h='';const days=weekDays(),pend=S.events.filter(e=>!e.day);
  if(pend.length)h+=`<div class="banner info">${ico('cal')}<span><b>Falta el día de ${pend.length===1?'1 actividad':pend.length+' actividades'}:</b> ${pend.map(e=>esc(e.title)).join(', ')}</span><button data-open="${esc(pend[0].id)}">Asignar día</button></div>`;
  const wkEnd=ymd(addDays(S.week,6)),fut=S.events.filter(e=>e.kind==='terreno'&&e.dateFrom&&e.dateFrom>wkEnd).map(e=>e.dateFrom).sort();
  if(fut.length&&!days.some(d=>eventsOn(d,true).some(e=>e.kind==='terreno'))){const f=parseYmd(fut[0]);h+=`<div class="banner info">${ico('repeat')}<span>Los terrenos de Intervención con Grupos comienzan el <b>${DAYS[f.getDay()].toLowerCase()} ${sd(f)}</b> y duran 2 semanas.</span><button data-week="${fut[0]}">Ver semana</button></div>`}
  if(mq.matches){const n=days.reduce((a,d)=>a+clashesOn(d).pairs.length,0);if(n){const first=days.find(d=>clashesOn(d).pairs.length);h+=`<div class="banner clash">${ico('warn')}<span><b>${n} ${n===1?'choque':'choques'} esta semana.</b> Los bloques rayados en rojo se superponen.</span><button data-jump="${ymd(first)}">Ver</button></div>`}}
  return h;
}

/* ---------- semana ---------- */
function weekHTML(){
  let dates=weekDays();if(!dates.slice(5).some(d=>eventsOn(d).length))dates=dates.slice(0,5);
  let lo=8*60,hi=22*60;S.events.forEach(e=>{if(e.day){lo=Math.min(lo,toMin(e.start));hi=Math.max(hi,toMin(e.end))}});
  lo=Math.floor(lo/60)*60;hi=Math.ceil(hi/60)*60;
  const H=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour'))||60;
  const px=m=>(m-lo)/60*H,total=px(hi),today=new Date();
  S.grid={lo,hi,H};
  const loads=dates.map(d=>activeOn(d).reduce((a,e)=>a+toMin(e.end)-toMin(e.start),0));
  let h=`<div class="board"><div class="scroller" id="scroller"><div class="grid" id="wgrid" style="grid-template-columns:var(--tc,56px) repeat(${dates.length},minmax(var(--cw,124px),1fr))"><div class="gh corner"></div>`;
  dates.forEach((d,i)=>{const hol=HOLIDAYS[ymd(d)];h+=`<button class="gh${sameDay(d,today)?' today':''}" data-jump="${ymd(d)}" title="Abrir ${DAYS[d.getDay()].toLowerCase()} ${sd(d)}${hol?' · Feriado: '+hol:''}"><div class="d"><small>${DSH[d.getDay()]}</small><b>${d.getDate()}</b></div><div class="load${loads[i]>=6*60?' hot':''}"><i style="width:${Math.min(100,loads[i]/600*100)}%"></i></div>${hol?`<span class="hol">Feriado · ${esc(hol)}</span>`:`<span class="hrs">${loads[i]?dur(loads[i]):'Libre'}</span>`}</button>`});
  h+=`<div class="times" style="height:${total}px">`;for(let m=lo+60;m<hi;m+=60)h+=`<div style="top:${px(m)}px">${fmtMin(m)}</div>`;h+='</div>';
  dates.forEach(d=>{
    const{ids}=clashesOn(d),isT=sameDay(d,today);
    h+=`<div class="col${isT?' today':''}" data-date="${ymd(d)}" style="height:${total}px">`;
    layoutDay(eventsOn(d)).forEach(e=>{
      const st=stateOf(e,d),top=px(toMin(e.start)),hh=Math.max(px(toMin(e.end))-top-2,20),w=100/e._n,clash=ids.has(e.id),compact=hh<34,ses=sessOf(e.id,d);
      const tag=st==='feriado'?' · feriado':st==='suspendida'?' · suspendida':ses&&ses.status==='realizada'?' · realizada':'';
      h+=`<button class="ev ${KCLS[e.kind]||'ko'}${clash?' is-clash':''}${st!=='ok'?' off':''}${compact?' compact':''}" data-open="${esc(e.id)}" data-date="${ymd(d)}" style="top:${top+1}px;height:${hh}px;left:calc(${w*e._c}% + 3px);width:calc(${w}% - 6px)" title="${esc(e.title)} · ${esc(e.start)}–${esc(e.end)}${clash?' · choque de horario':''}${tag}">${clash?'<span class="badge">!</span>':''}<span class="t">${ses&&ses.status==='realizada'?'✓ ':''}${esc(e.title)}</span><span class="h">${esc(e.start)}–${esc(e.end)}${e.estEnd?' ≈':''}</span>${hh>=58&&e.place?`<span class="p">${esc(e.place)}</span>`:''}<span class="rz" data-rz="1"></span></button>`;
    });
    if(isT){const nm=nowMin();if(nm>=lo&&nm<=hi)h+=`<div class="nowline" style="top:${px(nm)}px"></div>`}
    h+='</div>';
  });
  return h+'</div></div></div>';
}
function afterWeek(keep){
  const sc=document.getElementById('scroller');if(!sc||!S.grid)return;
  if(keep!=null){sc.scrollTop=keep;return}
  const starts=weekDays().flatMap(d=>eventsOn(d).map(e=>toMin(e.start)));
  const first=Math.min(...starts,sameDay(mondayOf(new Date()),S.week)?nowMin():1440);
  if(isFinite(first))sc.scrollTop=Math.max(0,(first-S.grid.lo-30)/60*S.grid.H);
}

/* ---------- día y agenda ---------- */
function itemHTML(e,d,{clash,isT,nm}){
  const st=stateOf(e,d),ses=sessOf(e.id,d),done=ses&&ses.status==='realizada';
  const live=st==='ok'&&isT&&toMin(e.start)<=nm&&toMin(e.end)>nm,past=isT&&toMin(e.end)<=nm;
  const att=e.people?.length&&ses&&Array.isArray(ses.present)?`<span class="chip">${ses.present.length}/${e.people.length} asistieron</span>`:'';
  return `<button class="item ${KCLS[e.kind]||'ko'}${clash?' is-clash':''}${live?' live':''}${past&&!done?' past':''}${st!=='ok'?' off':''}${done?' done':''}" data-open="${esc(e.id)}" data-date="${ymd(d)}">
    <div class="tm">${esc(e.start)}<small>${esc(e.end)}${e.estEnd?' ≈':''}</small></div>
    <div style="min-width:0"><div class="ti">${esc(e.title)}</div>
      <div class="meta">${e.place?`<span>${ico('pin')}${esc(e.place)}</span>`:''}${e.group?`<span>${ico('users')}${esc(e.group)}${e.people?.length?' · '+e.people.length:''}</span>`:''}<span>${ico('clock')}${dur(toMin(e.end)-toMin(e.start))}</span></div>
      <div class="chips"><span class="chip k" style="--k:${KVAR[e.kind]||KVAR.otro}">${KINDS[e.kind]||'Otro'}</span>${st==='feriado'?`<span class="chip red">Feriado</span>`:''}${st==='suspendida'?'<span class="chip red">Suspendida</span>':''}${done?'<span class="chip k" style="--k:var(--ase)">✓ Realizada</span>':''}${att}${clash?'<span class="chip red">Choque</span>':''}${live?'<span class="chip live">● Ahora</span>':''}${e.dateTo&&st==='ok'&&!done?`<span class="chip">hasta el ${sd(parseYmd(e.dateTo))}</span>`:''}</div>
    </div><span class="chev">${ico('r')}</span></button>`;
}
function sepHTML(prev,e,d,tight){
  const g=toMin(e.start)-toMin(prev.end),t=tight.find(x=>x.b.id===e.id);
  if(t)return `<div class="free tight">${ico('warn')}${t.g} min para llegar a ${esc(e.place||e.title)}</div>`;
  return g>=15?`<div class="free">${dur(g)} libre</div>`:'';
}
function dayHTML(){
  const all=weekDays();
  if(!all.some(d=>sameDay(d,S.sel)))S.sel=all.find(d=>sameDay(d,new Date()))||all.find(d=>eventsOn(d).length)||all[0];
  const today=new Date();
  let h=`<div class="mob-up">${upHTML()}</div><div class="daystrip" role="group" aria-label="Día">`;
  all.forEach(d=>{const l=eventsOn(d),k=[...new Set(l.map(e=>e.kind))],cl=clashesOn(d).pairs.length;
    h+=`<button data-day="${ymd(d)}" aria-pressed="${sameDay(d,S.sel)}" aria-label="${DAYS[d.getDay()]} ${d.getDate()}">${sameDay(d,today)?'<span class="tdot"></span>':''}<small>${DSH[d.getDay()]}</small><b>${d.getDate()}</b><span class="dots">${k.map(x=>`<i style="background:${KVAR[x]||KVAR.otro}"></i>`).join('')}${cl?'<i style="background:var(--clash)"></i>':''}</span></button>`});
  h+='</div>';
  const l=eventsOn(S.sel),{ids}=clashesOn(S.sel),isT=sameDay(S.sel,today),nm=nowMin(),tot=l.filter(e=>stateOf(e,S.sel)==='ok').reduce((a,e)=>a+toMin(e.end)-toMin(e.start),0);
  h+=`<div class="dayhead"><h2>${DAYS[S.sel.getDay()]} ${S.sel.getDate()} de ${MONTHS[S.sel.getMonth()]}</h2><span>${l.length?`${l.length} ${l.length===1?'bloque':'bloques'} · ${dur(tot)}`:'Día libre'}</span>${isT?'<span class="chip live">Hoy</span>':''}</div>`;
  const hol=HOLIDAYS[ymd(S.sel)];
  if(hol)h+=`<div class="banner clash">${ico('cal')}<span><b>Feriado: ${esc(hol)}.</b> Los bloques de este día no cuentan para choques ni avisos.</span></div>`;
  if(!l.length)return h+`<div class="empty"><div class="e">🌤️</div><b style="color:var(--ink)">Día libre</b><span>No hay bloques este día.</span><button class="btn" data-act="new">${ico('plus')}Agregar bloque</button></div>`;
  const tight=tightOn(S.sel);
  h+='<div class="tl">';
  l.forEach((e,i)=>{if(i)h+=sepHTML(l[i-1],e,S.sel,tight);h+=itemHTML(e,S.sel,{clash:ids.has(e.id),isT,nm})});
  return h+'</div>';
}
function agendaHTML(){
  const t=startOfDay(new Date()),start=S.week<=t&&addDays(S.week,7)>t?t:S.week,nm=nowMin();
  let h='<div class="agenda">',any=false;
  for(let i=0;i<21;i++){
    const d=addDays(start,i),l=eventsOn(d);if(!l.length)continue;any=true;
    const{ids}=clashesOn(d),isT=sameDay(d,t),lbl=isT?'Hoy':sameDay(d,addDays(t,1))?'Mañana':DAYS[d.getDay()];
    h+=`<section style="display:grid;gap:8px"><h3><b>${lbl}</b>${sd(d)} · ${l.length} ${l.length===1?'bloque':'bloques'}${ids.size?' · <span style="color:var(--clash);font-weight:600">choque</span>':''}</h3><div class="tl">${l.map(e=>itemHTML(e,d,{clash:ids.has(e.id),isT,nm})).join('')}</div></section>`;
  }
  if(!any)h+='<div class="empty"><div class="e">🌤️</div>Nada agendado en las próximas 3 semanas.</div>';
  return h+'</div>';
}

/* ---------- drawer ---------- */
function openDrawer(title,body){
  const L=document.getElementById('layer');
  L.innerHTML=`<div class="scrim" data-close></div><div class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dr-h"><h2>${esc(title)}</h2><button class="btn ghost ic" data-close aria-label="Cerrar">${ico('x')}</button></div><div class="dr-b">${body}</div></div>`;
  if(!mq.matches)setTimeout(()=>L.querySelector('.dr-b input, .dr-b .btn')?.focus({preventScroll:true}),60);
}
function closeLayer(){document.getElementById('layer').innerHTML=''}

function openDetail(id,dateStr){
  const e=S.events.find(x=>x.id===id);if(!e)return;
  const d=dateStr?parseYmd(dateStr):nextOccurrence(e);
  S.detail={id,date:d?ymd(d):null};
  const st=d?stateOf(e,d):'ok',hol=d&&HOLIDAYS[ymd(d)];
  const clashes=d?clashesOn(d).pairs.filter(c=>c.a.id===id||c.b.id===id):[];
  const tight=d?tightOn(d).filter(t=>t.a.id===id||t.b.id===id):[];
  const nx=nextOccurrence(e),ses=d?sessOf(id,d):null,status=ses?.status||'pendiente';
  const range=e.dateFrom||e.dateTo?`Del ${e.dateFrom?sd(parseYmd(e.dateFrom)):'inicio'} al ${e.dateTo?sd(parseYmd(e.dateTo)):'fin del semestre'}`:'Todo el semestre';
  const gc=gcalURL(e),dl=d?`${DAYS[d.getDay()].toLowerCase()} ${sd(d)}`:'';
  const present=new Set(ses?.present||[]);
  openDrawer(KINDS[e.kind]||'Bloque',`
    <div style="display:grid;gap:10px"><span class="chip k" style="--k:${KVAR[e.kind]||KVAR.otro};justify-self:start">${KINDS[e.kind]||'Otro'}${e.group?' · '+esc(e.group):''}</span><div class="dt-title">${esc(e.title)}</div></div>
    ${hol?`<div class="warnbox"><b>${ico('cal')}Feriado · ${esc(hol)}</b><span>El ${dl} no hay clases. Este bloque no cuenta para choques ni avisos.</span></div>`:''}
    ${clashes.length?`<div class="warnbox"><b>${ico('warn')}Choque de horario · ${dl}</b>${clashes.map(c=>{const o=c.a.id===id?c.b:c.a;return `<span>Se superpone ${dur(c.ov)} con <b style="display:inline">${esc(o.title)}</b> (${esc(o.start)}–${esc(o.end)}).</span><div class="dr-actions"><button class="btn" data-act="suspend" data-id="${esc(o.id)}" data-date="${ymd(d)}">Suspender «${esc(o.title)}» ese día</button><button class="btn" data-act="suspend" data-id="${esc(id)}" data-date="${ymd(d)}">Suspender este</button></div>`}).join('')}<span style="font-size:12px;opacity:.85">También puedes moverlo con Editar o arrastrándolo en la semana.</span></div>`:''}
    ${tight.map(t=>`<div class="infobox"><b>${ico('warn')} Traslado ajustado · ${dl}</b><span>Tienes ${t.g} min entre ${esc(t.a.title)} (termina ${esc(t.a.end)}${t.a.place?' en '+esc(t.a.place):''}) y ${esc(t.b.title)} (${esc(t.b.start)}${t.b.place?' en '+esc(t.b.place):''}).</span></div>`).join('')}
    <div class="rows">
      <div class="rowi">${ico('clock')}<div><b>${e.day?DAYS[e.day%7]:'Día por confirmar'} · ${esc(e.start)}–${esc(e.end)}</b><small>${dur(toMin(e.end)-toMin(e.start))}${e.estEnd?' · término estimado':''}</small></div></div>
      <div class="rowi">${ico('repeat')}<div>Cada semana<small>${range}</small></div></div>
      ${nx?`<div class="rowi">${ico('cal')}<div>Próxima vez<small>${DAYS[nx.getDay()]} ${nx.getDate()} de ${MONTHS[nx.getMonth()]}</small></div></div>`:''}
      ${e.place?`<div class="rowi">${ico('pin')}<div>${esc(e.place)}</div></div>`:''}
      ${e.note?`<div class="rowi">${ico('note')}<div>${esc(e.note)}</div></div>`:''}
    </div>
    ${d&&!hol?`<div class="sess"><h3>Sesión del ${dl}<small id="att-count">${e.people?.length?`${present.size}/${e.people.length} presentes`:''}</small></h3>
      <div class="seg full" role="group" aria-label="Estado de la sesión">${[['pendiente','Pendiente'],['realizada','Realizada'],['suspendida','Suspendida']].map(([k,n])=>`<button data-st="${k}" aria-pressed="${status===k}">${n}</button>`).join('')}</div>
      ${e.people?.length?`<div>${e.people.map((n,i)=>`<label class="att"><input type="checkbox" data-att="${esc(n)}"${present.has(n)?' checked':''}><span class="ini">${esc(initials(n))}</span><span style="min-width:0">${esc(n)}${e.emails?.[i]?`<small>${esc(e.emails[i])}</small>`:''}</span></label>`).join('')}</div>`:''}
      <label class="f">Bitácora de la sesión<textarea id="sess-note" placeholder="Qué se trabajó, acuerdos, observaciones del grupo…">${esc(ses?.note||'')}</textarea></label>
      <span style="font-size:12px;color:var(--muted)">Se guarda solo al salir del cuadro.</span>
    </div>`:''}
    ${!d&&e.people?.length?`<div style="display:grid;gap:10px"><div class="lbl">Integrantes · ${e.people.length}</div><div class="people">${e.people.map(n=>`<div class="person"><span class="ini">${esc(initials(n))}</span>${esc(n)}</div>`).join('')}</div></div>`:''}
    <div class="dr-actions"><button class="btn pri" data-act="edit" data-id="${esc(e.id)}">${ico('edit')}Editar</button><button class="btn" data-act="dup" data-id="${esc(e.id)}">${ico('copy')}Duplicar</button>${e.emails?.length?`<button class="btn" data-act="mails" data-id="${esc(e.id)}">${ico('users')}Copiar correos</button>`:''}${gc?`<a class="btn" href="${esc(gc)}" target="_blank" rel="noopener">${ico('cal')}Google Calendar</a>`:''}<span class="spacer"></span><button class="btn danger" data-act="del" data-id="${esc(e.id)}">Eliminar</button></div>
    <div id="mailbox"></div>`);
  const note=document.getElementById('sess-note');
  if(note)note.addEventListener('change',()=>{const k=skey(id,d),cur=S.sessions[k]||{eventId:id,date:ymd(d),status:'pendiente'};saveSession(k,{...cur,eventId:id,date:ymd(d),note:note.value.trim()});toast('Bitácora guardada',`${e.title} · ${dl}`)});
}
function openEditor(ev,preset){
  const isNew=!ev;
  const e=ev||{kind:'catedra',day:dowOf(S.sel),start:'09:00',end:'10:20',...preset};
  const dayOpts=[1,2,3,4,5,6,7].map(d=>`<option value="${d}"${Number(e.day)===d?' selected':''}>${DAYS[d%7]}</option>`).join('')+`<option value="0"${!Number(e.day)?' selected':''}>Por confirmar</option>`;
  openDrawer(isNew?'Nuevo bloque':'Editar bloque',`
  <form id="evform" class="form" autocomplete="off">
    <label class="f full">Nombre<input id="f-title" required value="${esc(e.title||'')}" placeholder="Ej: Desempeño ético"></label>
    <div class="full kinds" role="radiogroup" aria-label="Tipo">${Object.entries(KINDS).map(([k,n])=>`<label style="--k:${KVAR[k]}"><input type="radio" name="kind" value="${k}"${(e.kind||'otro')===k?' checked':''}><i></i>${n}</label>`).join('')}</div>
    <label class="f">Día<select id="f-day">${dayOpts}</select></label>
    <label class="f">Sala / lugar<input id="f-place" value="${esc(e.place||'')}" placeholder="Ej: E-31"></label>
    <label class="f">Inicio<input id="f-start" type="time" step="300" required value="${esc(e.start||'')}"></label>
    <label class="f">Término<input id="f-end" type="time" step="300" required value="${esc(e.end||'')}"></label>
    <label class="f">Desde (opcional)<input id="f-from" type="date" value="${esc(e.dateFrom||'')}"></label>
    <label class="f">Hasta (opcional)<input id="f-to" type="date" value="${esc(e.dateTo||'')}"></label>
    <label class="f full">Grupo (opcional)<input id="f-group" value="${esc(e.group||'')}" placeholder="Ej: Grupo 3"></label>
    <label class="f full">Integrantes (uno por línea)<textarea id="f-people">${esc((e.people||[]).join('\n'))}</textarea></label>
    <label class="f full">Correos (uno por línea, mismo orden)<textarea id="f-emails" style="min-height:64px">${esc((e.emails||[]).join('\n'))}</textarea></label>
    <label class="f full">Nota<input id="f-note" value="${esc(e.note||'')}"></label>
    <div id="f-clash" class="full"></div>
    <div class="full dr-actions"><button class="btn pri" type="submit">${isNew?'Crear bloque':'Guardar cambios'}</button><button type="button" class="btn" data-close>Cancelar</button></div>
  </form>`);
  const f=document.getElementById('evform');
  const check=()=>{
    const t={day:Number(f['f-day'].value),start:f['f-start'].value,end:f['f-end'].value,from:f['f-from'].value,to:f['f-to'].value};
    const o=S.events.filter(x=>x.id!==e.id&&Number(x.day)===t.day&&toMin(x.start)<toMin(t.end)&&toMin(t.start)<toMin(x.end)&&!(t.to&&x.dateFrom&&x.dateFrom>t.to)&&!(t.from&&x.dateTo&&x.dateTo<t.from));
    const bad=t.start&&t.end&&toMin(t.end)<=toMin(t.start);
    document.getElementById('f-clash').innerHTML=bad?`<div class="warnbox">El término debe ser después del inicio.</div>`:t.day&&o.length?`<div class="warnbox"><b>${ico('warn')}Este horario choca con:</b>${o.map(x=>`<span>${esc(x.title)} · ${esc(x.start)}–${esc(x.end)}</span>`).join('')}</div>`:'';
  };
  f.addEventListener('input',check);check();
  f.addEventListener('submit',async ev2=>{
    ev2.preventDefault();if(toMin(f['f-end'].value)<=toMin(f['f-start'].value))return;
    const out={...e,title:f['f-title'].value.trim(),kind:f.kind.value,day:Number(f['f-day'].value),place:f['f-place'].value.trim(),start:f['f-start'].value,end:f['f-end'].value,dateFrom:f['f-from'].value,dateTo:f['f-to'].value,group:f['f-group'].value.trim(),people:f['f-people'].value.split('\n').map(s=>s.trim()).filter(Boolean),emails:f['f-emails'].value.split('\n').map(s=>s.trim()).filter(Boolean),note:f['f-note'].value.trim()};
    if(isNew)delete out.id;
    if(ev&&(ev.start!==out.start||ev.end!==out.end))delete out.estEnd;

  });
}

async function fileToText(file){
  if(/\.docx$/i.test(file.name)){
    if(!window.JSZip)throw new Error('nozip');
    const zip=await JSZip.loadAsync(await file.arrayBuffer());
    const xml=await zip.file('word/document.xml').async('string');
    return xml.replace(/<\/w:tc>/g,' | ').replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,' ').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\n{3,}/g,'\n\n').trim();
  }
  return await file.text();
}

"""${txt.slice(0,20000)}"""`;

function normalize(evs){
  return evs.map(e=>({title:String(e.title||'Sin nombre'),kind:KINDS[e.kind]?e.kind:'otro',day:Math.max(0,Math.min(7,Number(e.day)||0)),start:String(e.start||'').slice(0,5).padStart(5,'0'),end:String(e.end||'').slice(0,5).padStart(5,'0'),place:e.place||'',dateFrom:e.dateFrom||'',dateTo:e.dateTo||'',group:e.group||'',people:Array.isArray(e.people)?e.people.map(String):undefined,note:e.note||'',estEnd:e.estEnd?true:undefined})).filter(e=>/^\d\d:\d\d$/.test(e.start)&&/^\d\d:\d\d$/.test(e.end));

async function bulk(evs,replace){

}

/* ---------- .ics ---------- */
function buildICS(){
  const p=S.profile,L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mi Horario UA//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Horario UA'];
  const ie=s=>String(s||'').replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const dt=(d,m)=>ymd(d).replace(/-/g,'')+'T'+fmtMin(m).replace(':','')+'00';
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  S.events.filter(e=>e.day).forEach(e=>{
    const to=e.dateTo||p.semEnd;let first=parseYmd(e.dateFrom||p.semStart||ymd(new Date()));
    while(dowOf(first)!==Number(e.day))first=addDays(first,1);
    if(to&&ymd(first)>to)return;
    const sm=toMin(e.start),em=toMin(e.end),eve=sm+180;
    L.push('BEGIN:VEVENT','UID:'+e.id+'@horario-ua','DTSTAMP:'+stamp,'DTSTART:'+dt(first,sm),'DTEND:'+dt(first,em));
    if(to){L.push('RRULE:FREQ=WEEKLY;UNTIL='+to.replace(/-/g,'')+'T235959');
      const ex=[];for(let d=new Date(first);ymd(d)<=to;d=addDays(d,7))if(stateOf(e,d)!=='ok')ex.push(dt(d,sm));
      if(ex.length)L.push('EXDATE:'+ex.join(','))}
    L.push('SUMMARY:'+ie(e.title),'LOCATION:'+ie(e.place),'DESCRIPTION:'+ie([KINDS[e.kind],e.group,(e.people||[]).join(', '),e.note].filter(Boolean).join('\n')));
    if(p.notify20!==false)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+ie('En 20 min: '+e.title),'TRIGGER:-PT20M','END:VALARM');
    if(p.notifyEve!==false)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+ie('Mañana: '+e.title+' '+e.start),'TRIGGER:-PT'+Math.floor(eve/60)+'H'+(eve%60)+'M','END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');return L.join('\r\n');
}
async function download(name,data,type){

  if(!dl){toast('Descarga no disponible aquí','Abre la página en claude.ai para descargar el archivo.');return}
  try{const r=await dl.save({filename:name,data:new Blob([data],{type})});if(r&&r.status==='saved')toast('Archivo listo',name)}catch(e){if(e&&e.code!=='cancelled'&&e.code!=='declined')toast('No se pudo descargar','Inténtalo otra vez.')}
}

function tick(){
  const p=S.profile,n=new Date(),k=ymd(n),seen=lsGet(LS+'.seen',{}),nm=nowMin();let ch=false;
  if(p.notify20!==false)activeOn(n).forEach(e=>{const d=toMin(e.start)-nm,key='20:'+k+':'+e.id;if(d>0&&d<=20&&!seen[key]){seen[key]=1;ch=true;notify(`En ${d} min: ${e.title}`,`${e.start}–${e.end}${e.place?' · '+e.place:''}`)}});
  if(p.notifyEve!==false&&n.getHours()>=21&&!seen['eve:'+k]){seen['eve:'+k]=1;ch=true;const t=addDays(startOfDay(n),1),l=activeOn(t),cl=clashesOn(t).pairs.length,tg=tightOn(t).length;
    if(l.length)notify(`Mañana ${DAYS[t.getDay()].toLowerCase()}: ${l.length} ${l.length===1?'bloque':'bloques'} ${p.emoji||''}`,l.map(e=>`${e.start} ${e.title}`).join(' · ')+(cl?` · ${cl} choque${cl>1?'s':''}`:'')+(tg?` · ${tg} traslado${tg>1?'s':''} ajustado${tg>1?'s':''}`:''))}
  if(ch){const y=ymd(addDays(n,-1));Object.keys(seen).forEach(x=>{if(!x.includes(k)&&!x.includes(y))delete seen[x]});lsSet(LS+'.seen',seen)}
}

  const q=document.getElementById('pal-q'),list=document.getElementById('pal-l');let items=[],idx=0;

    {g:'Acciones',t:'Vista agenda',k:'3',run:()=>go(()=>S.view='agenda')},
    {g:'Acciones',t:'Ver semana de terrenos',run:()=>{const f=S.events.filter(e=>e.kind==='terreno'&&e.dateFrom).map(e=>e.dateFrom).sort()[0];if(f)toWeek(f)}},
    {g:'Acciones',t:'Descargar calendario (.ics)',run:()=>download('horario-ua.ics',buildICS(),'text/calendar')},
    {g:'Acciones',t:'Nuevo semestre con Claude',run:()=>openSettings()},
    {g:'Acciones',t:'Ajustes',run:()=>openSettings()},
  ];
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const draw=()=>{
    const s=norm(q.value.trim());

      .map(e=>{const nx=nextOccurrence(e),who=s&&(e.people||[]).find(p=>norm(p).includes(s));return{g:'Bloques',t:e.title,dot:KVAR[e.kind]||KVAR.otro,sub:(who?who+' · ':'')+(e.day?DSH[e.day%7]+' '+e.start:'Día por confirmar'),run:()=>openDetail(e.id,nx?ymd(nx):null)}});
