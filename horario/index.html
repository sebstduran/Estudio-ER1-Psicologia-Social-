<title>Mi Horario UA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: agenda serena — barra lateral liviana (saludo, lo próximo, mes, avisos) + lienzo semanal limpio; en celular, una sola columna con pestañas. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --sunken:#f1f3f6; --ink:#1c2230; --ink-2:#465063; --muted:#7a8394; --faint:#b0b6c1; --line:#e7eaef; --line-2:#f1f3f6;
  --accent:#4a5fc1; --accent-soft:#eef0fa; --primary:#1c2230; --on-primary:#ffffff;
  --cat:#5a6dc6; --cat-soft:#eff1fb; --cat-ink:#33438f;
  --ase:#3f8f7a; --ase-soft:#eaf4f0; --ase-ink:#2a6252;
  --ter:#c08a3e; --ter-soft:#f9f2e6; --ter-ink:#81561b;
  --otr:#a1608f; --otr-soft:#f7eef4; --otr-ink:#71405f;
  --clash:#d0565c; --clash-soft:#fcefee; --clash-ink:#9f363c;
  --now:#d0565c;
  --sh-1:0 1px 2px rgba(28,34,48,.04);
  --sh-2:0 1px 2px rgba(28,34,48,.04),0 8px 24px -12px rgba(28,34,48,.14);
  --sh-3:0 20px 50px -12px rgba(28,34,48,.28),0 2px 6px rgba(28,34,48,.06);
  --f-ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-serif:"Instrument Serif",ui-serif,Georgia,"Times New Roman",serif;
  --hour:58px; --side:272px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10131a; --panel:#161a23; --sunken:#1c212c; --ink:#e8ebf1; --ink-2:#bfc6d2; --muted:#8a93a4; --faint:#555d6c; --line:#252b37; --line-2:#1c212b;
  --accent:#97a6f0; --accent-soft:#1e2442; --primary:#e8ebf1; --on-primary:#10131a;
  --cat:#8e9df0; --cat-soft:#1d2342; --cat-ink:#cfd6ff;
  --ase:#72c6ad; --ase-soft:#152c27; --ase-ink:#b9e8d9;
  --ter:#e2b56f; --ter-soft:#2f2619; --ter-ink:#f4ddb6;
  --otr:#d49ac4; --otr-soft:#311f2c; --otr-ink:#f1d1e7;
  --clash:#f08388; --clash-soft:#371c1f; --clash-ink:#ffcfd2; --now:#f08388;
  --sh-1:0 1px 2px rgba(0,0,0,.3); --sh-2:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); --sh-3:0 24px 60px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131a; --panel:#161a23; --sunken:#1c212c; --ink:#e8ebf1; --ink-2:#bfc6d2; --muted:#8a93a4; --faint:#555d6c; --line:#252b37; --line-2:#1c212b;
  --accent:#97a6f0; --accent-soft:#1e2442; --primary:#e8ebf1; --on-primary:#10131a;
  --cat:#8e9df0; --cat-soft:#1d2342; --cat-ink:#cfd6ff;
  --ase:#72c6ad; --ase-soft:#152c27; --ase-ink:#b9e8d9;
  --ter:#e2b56f; --ter-soft:#2f2619; --ter-ink:#f4ddb6;
  --otr:#d49ac4; --otr-soft:#311f2c; --otr-ink:#f1d1e7;
  --clash:#f08388; --clash-soft:#371c1f; --clash-ink:#ffcfd2; --now:#f08388;
  --sh-1:0 1px 2px rgba(0,0,0,.3); --sh-2:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); --sh-3:0 24px 60px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
.serif{font-family:var(--f-serif);font-weight:400;letter-spacing:-.01em}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500}
kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted);background:var(--panel)}
.spacer{flex:1}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- estructura ---------- */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);padding:26px 20px 22px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:26px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;scrollbar-width:thin}
.side>*{flex-shrink:0}
.main{min-width:0;display:flex;flex-direction:column}

.brand{display:grid;gap:14px}
.brand-row{display:flex;align-items:center;gap:12px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--sunken);font-size:22px;display:grid;place-items:center;transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.avatar:hover{transform:rotate(-10deg) scale(1.08)}
.avatar.pop{animation:pop .55s cubic-bezier(.3,1.7,.5,1)}
.brand b{display:block;font-size:14px;font-weight:600}
.brand span{font-size:12px;color:var(--muted)}
.prog{display:grid;gap:6px}
.prog .bar{height:3px;border-radius:9px;background:var(--line);overflow:hidden;display:flex}
.prog .bar i{display:block;height:100%;background:var(--ink-2);opacity:.55}
.prog .bar i.g{background:var(--ase);opacity:1}
.prog small{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}

/* lo próximo */
.up{border:0;text-align:left;background:var(--sunken);color:var(--ink);border-radius:16px;padding:16px;display:grid;gap:4px;position:relative;width:100%;transition:background .2s}
.up:hover{background:color-mix(in srgb,var(--sunken) 70%,var(--line))}
.up .lbl{display:flex;align-items:center;gap:7px}
.up .t{font-weight:600;font-size:14.5px;line-height:1.3;margin-top:4px}
.up .m{font-size:12.5px;color:var(--muted)}
.up .c{display:block;font-family:var(--f-serif);font-size:30px;line-height:1.05;margin-top:6px;letter-spacing:-.01em}
.up .c::first-letter{text-transform:uppercase}
.up .bar{height:3px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.up .bar i{display:block;height:100%;background:var(--now)}
.up .pulse{width:6px;height:6px;border-radius:50%;background:var(--now);animation:pulse 2s infinite}

/* mini mes */
.mini{display:grid;gap:8px}
.mini-h{display:flex;align-items:center;justify-content:space-between}
.mini-h b{font-family:var(--f-serif);font-weight:400;font-size:19px;text-transform:capitalize}
.mini-g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px 0;text-align:center}
.mini-g .dn{font-size:10.5px;color:var(--faint);padding:2px 0}
.mini-g button{border:0;background:none;border-radius:8px;height:31px;font-size:12.5px;position:relative;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.mini-g button:hover{background:var(--sunken)}
.mini-g button.out{color:var(--faint)}
.mini-g button.inwk{background:var(--sunken);border-radius:0}
.mini-g button.inwk.ws{border-radius:9px 0 0 9px}.mini-g button.inwk.we{border-radius:0 9px 9px 0}
.mini-g button.td{color:#fff;font-weight:600}
.mini-g button.td::before{content:"";position:absolute;inset:3px 7px;border-radius:50%;background:var(--now)}
.mini-g button span{position:relative}
.mini-g button i{position:absolute;left:50%;bottom:2px;width:3px;height:3px;border-radius:50%;transform:translateX(-50%)}

/* filtros y avisos */
.sect{display:grid;gap:4px}
.sect>.lbl{padding:0 4px 4px}
.filt{display:flex;align-items:center;gap:10px;border:0;background:none;width:100%;padding:6px 4px;border-radius:8px;text-align:left;color:var(--ink-2);font-size:13.5px}
.filt:hover{background:var(--sunken)}
.filt .sw{width:9px;height:9px;border-radius:50%;flex:none;background:var(--k);box-shadow:0 0 0 2px color-mix(in srgb,var(--k) 22%,transparent)}
.filt .n{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.filt.off{color:var(--faint)}.filt.off .sw{background:transparent;box-shadow:inset 0 0 0 1.5px var(--faint)}
.al{display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;align-items:start;border:0;background:none;width:100%;text-align:left;padding:7px 4px;border-radius:8px}
.al:hover{background:var(--sunken)}
.al i{width:7px;height:7px;border-radius:50%;margin-top:6px;background:var(--muted)}
.al.clash i{background:var(--clash)}.al.ter i{background:var(--ter)}.al.info i{background:var(--accent)}
.al b{display:block;font-weight:500;font-size:13px;color:var(--ink)}
.al small{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.calm{font-size:13px;color:var(--muted);padding:2px 4px;display:flex;gap:8px;align-items:center}
.calm::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ase)}
.side-foot{margin-top:auto;display:grid;gap:8px}
.sync{font-size:11.5px;color:var(--faint);display:inline-flex;align-items:center;gap:7px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--ase)}

/* ---------- cabecera ---------- */
.top{padding:30px max(28px,env(safe-area-inset-right,0px)) 18px 36px;display:grid;gap:20px}
.greet{display:flex;gap:12px;align-items:center;min-width:0}
.greet h1{font-family:var(--f-serif);font-weight:400;font-size:40px;line-height:1.02;letter-spacing:-.015em}
.greet h1 em{font-style:italic;color:var(--accent)}
.greet p{margin:6px 0 0;color:var(--muted);font-size:14px}
.top-r2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wknav{display:flex;align-items:center;gap:2px}
.wknav .title{font-weight:600;font-size:15px;padding:0 10px;border:0;background:none;border-radius:8px;white-space:nowrap;height:34px}
.wknav .title small{color:var(--muted);font-weight:400;margin-left:8px}
.btn{height:34px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:background .15s,transform .08s,border-color .15s;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--sunken)}
.btn:active{transform:scale(.97)}
.btn.ic{width:34px;padding:0;justify-content:center}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.pri:hover{opacity:.88}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.danger{color:var(--clash)}
.btn.danger.arm{background:var(--clash);color:#fff;border-color:transparent}
.btn.search{color:var(--muted);min-width:190px;justify-content:flex-start}
.btn.search kbd{margin-left:auto}
.seg{display:inline-flex;background:var(--sunken);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;height:28px;padding:0 13px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--sh-1)}
.content{padding:4px max(28px,env(safe-area-inset-right,0px)) 36px 36px;display:grid;gap:16px;min-width:0;align-content:start}
.notice{display:flex;align-items:center;gap:10px;border:0;background:var(--panel);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--ink-2);width:100%;text-align:left;box-shadow:var(--sh-1)}
.notice i{width:7px;height:7px;border-radius:50%;background:var(--clash);flex:none}
.notice span{margin-left:auto;color:var(--muted);display:inline-flex;align-items:center}

/* ---------- semana ---------- */
.board{background:var(--panel);border-radius:18px;box-shadow:var(--sh-2);overflow:hidden}
.scroller{overflow:auto;max-height:calc(100vh - 200px);min-height:440px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.grid{display:grid;min-width:720px;position:relative}
.gh{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px);border:0;border-bottom:1px solid var(--line);padding:14px 12px 12px;display:grid;gap:2px;cursor:pointer;text-align:left;color:var(--ink);border-radius:0}
.gh.corner{cursor:default;left:0;z-index:7}
.gh .d{display:flex;align-items:baseline;gap:7px}
.gh .d small{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.gh .d b{font-family:var(--f-serif);font-weight:400;font-size:26px;line-height:1;font-variant-numeric:lining-nums}
.gh.today .d b{color:var(--now)}
.gh.today .d small{color:var(--now)}
.gh .hrs{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.gh .load{display:none}
.hol{font-size:11px;color:var(--clash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.times{position:sticky;left:0;z-index:5;background:var(--panel)}
.times div{position:absolute;right:10px;transform:translateY(-50%);font-family:var(--f-mono);font-size:10px;color:var(--faint)}
.col{position:relative;border-left:1px solid var(--line-2);background-image:linear-gradient(var(--line-2) 1px,transparent 1px);background-size:100% var(--hour)}
.col.today{background-color:color-mix(in srgb,var(--now) 2.5%,transparent)}
.nowline{position:absolute;left:0;right:0;height:1.5px;background:var(--now);z-index:9;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3.5px;width:8px;height:8px;border-radius:50%;background:var(--now)}
.ev{--k:var(--otr);position:absolute;border:0;text-align:left;border-radius:10px;padding:6px 9px 6px 11px;overflow:hidden;display:flex;flex-direction:column;gap:1px;line-height:1.25;transition:box-shadow .2s,transform .2s;user-select:none;-webkit-user-select:none;background:var(--ks);color:var(--ink)}
.ev>*{flex:none}
.ev::before{content:"";position:absolute;left:4px;top:7px;bottom:7px;width:2.5px;border-radius:3px;background:var(--k)}
.ev:hover{box-shadow:var(--sh-2);transform:translateY(-1px);z-index:8}
.ev .t{font-weight:550;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;color:var(--kn)}
.ev .h{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.ev .p{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.compact{flex-direction:row;align-items:center;gap:6px;padding-top:2px;padding-bottom:2px}
.ev.compact::before{top:4px;bottom:4px}
.ev.compact .t{white-space:nowrap}
.ev .rz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.ev.dragging{box-shadow:var(--sh-3);z-index:20;cursor:grabbing;transition:none}
.ev.ghost{background:var(--accent-soft);outline:1.5px dashed var(--accent);outline-offset:-1.5px;pointer-events:none}
.ev.ghost::before{display:none}
.ev.ghost .t{color:var(--accent)}
@media (hover:hover) and (pointer:fine){.ev{cursor:grab}.col{cursor:crosshair}}
.kc{--k:var(--cat);--ks:var(--cat-soft);--kn:var(--cat-ink)}
.ka{--k:var(--ase);--ks:var(--ase-soft);--kn:var(--ase-ink)}
.kt{--k:var(--ter);--ks:var(--ter-soft);--kn:var(--ter-ink)}
.ko{--k:var(--otr);--ks:var(--otr-soft);--kn:var(--otr-ink)}
.ev.is-clash{box-shadow:inset 0 0 0 1.5px var(--clash)}
.badge{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--clash);font-size:0}
.ev.off{--k:var(--faint);background:var(--sunken)}
.ev.off .t{color:var(--muted)}
.ev.off .t,.item.off .ti{text-decoration:line-through;text-decoration-thickness:1px}

/* ---------- día / agenda ---------- */
.daystrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.daystrip button{border:0;background:none;border-radius:14px;padding:8px 0;display:grid;justify-items:center;gap:3px;position:relative}
.daystrip button:hover{background:var(--panel)}
.daystrip small{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.daystrip b{font-family:var(--f-serif);font-weight:400;font-size:24px;line-height:1}
.daystrip button[aria-pressed="true"]{background:var(--panel);box-shadow:var(--sh-2)}
.daystrip button[aria-pressed="true"] b{color:var(--accent)}
.daystrip .dots{display:flex;gap:3px;height:4px}
.daystrip .dots i{width:4px;height:4px;border-radius:50%}
.daystrip .tdot{position:absolute;top:7px;right:9px;width:5px;height:5px;border-radius:50%;background:var(--now)}
.dayhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-top:6px}
.dayhead h2{font-family:var(--f-serif);font-weight:400;font-size:30px;line-height:1.1}
.dayhead span{color:var(--muted);font-size:13px}
.tl{display:grid;gap:10px}
.item{--k:var(--otr);width:100%;border:0;background:var(--panel);color:var(--ink);border-radius:16px;padding:15px 18px 15px 20px;display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:16px;align-items:center;text-align:left;position:relative;box-shadow:var(--sh-1);transition:box-shadow .2s,transform .2s}
.item:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.item::before{content:"";position:absolute;left:8px;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--k)}
.item.kc{--k:var(--cat)}.item.ka{--k:var(--ase)}.item.kt{--k:var(--ter)}
.item.is-clash{box-shadow:inset 0 0 0 1.5px var(--clash)}
.item .tm{font-family:var(--f-mono);font-size:13.5px;line-height:1.35;color:var(--ink)}
.item .tm small{display:block;color:var(--faint);font-size:12px}
.item .ti{font-weight:550;font-size:15px;line-height:1.3}
.item .meta{margin-top:3px;color:var(--muted);font-size:13px}
.item .st{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:12px;font-weight:500}
.item .st span{display:inline-flex;align-items:center;gap:6px}
.item .st span::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st .c{color:var(--clash)}.st .g{color:var(--ase)}.st .n{color:var(--now)}.st .m{color:var(--muted)}
.item.live{box-shadow:0 0 0 1.5px var(--now),var(--sh-2)}
.item.past{opacity:.55}
.item.off{opacity:.55}
.item .chev{color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.k{background:color-mix(in srgb,var(--k) 13%,transparent);color:var(--k)}
.chip.live{background:var(--now);color:#fff}
.dayhead .chip.live{background:var(--accent-soft);color:var(--accent)}
.free{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px;padding:0 0 0 20px}
.free::after{content:"";flex:1;border-top:1px dotted var(--line)}
.free.tight{color:var(--ter-ink)}
.free.tight svg{width:13px;height:13px}
.agenda{display:grid;gap:26px}
.agenda h3{display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--muted);font-weight:400}
.agenda h3 b{font-family:var(--f-serif);font-weight:400;font-size:24px;color:var(--ink)}
.empty{border-radius:18px;padding:44px 18px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center;background:var(--panel);box-shadow:var(--sh-1)}
.empty .e{font-size:30px}
.empty b{font-family:var(--f-serif);font-weight:400;font-size:24px;color:var(--ink)}

/* ---------- panel lateral derecho ---------- */

<script>
(() => {
const DAYS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DSH=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MSH=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const KINDS={catedra:'Clase',asesoria:'Asesoría',terreno:'Terreno',otro:'Otro'};
const KPLURAL={catedra:'Clases',asesoria:'Asesorías de práctica',terreno:'Terrenos',otro:'Otros'};
const KCLS={catedra:'kc',asesoria:'ka',terreno:'kt',otro:'ko'};
const KVAR={catedra:'var(--cat)',asesoria:'var(--ase)',terreno:'var(--ter)',otro:'var(--otr)'};
const EMOJIS=['🦉','🧠','🌱','☕','🚀','🐙','🦊','📚','✨','🐢','🎧','🌈','🦄','🐝','🌻','🧉'];
const DEFAULT_PROFILE={name:'Sebastián',emoji:'🦉',semStart:'2026-08-10',semEnd:'2026-12-11',notify20:true,notifyEve:true};
const HOLIDAYS={'2026-09-18':'Independencia Nacional','2026-09-19':'Glorias del Ejército','2026-10-12':'Encuentro de Dos Mundos','2026-10-31':'Iglesias Evangélicas','2026-11-01':'Todos los Santos','2026-12-08':'Inmaculada Concepción','2026-12-25':'Navidad','2027-01-01':'Año Nuevo','2027-03-26':'Viernes Santo','2027-03-27':'Sábado Santo','2027-05-01':'Día del Trabajo','2027-05-21':'Glorias Navales','2027-06-21':'Pueblos Indígenas','2027-06-28':'San Pedro y San Pablo','2027-07-16':'Virgen del Carmen','2027-08-15':'Asunción de la Virgen','2027-09-17':'Feriado Fiestas Patrias','2027-09-18':'Independencia Nacional','2027-09-19':'Glorias del Ejército','2027-10-11':'Encuentro de Dos Mundos','2027-10-31':'Iglesias Evangélicas','2027-11-01':'Todos los Santos','2027-12-08':'Inmaculada Concepción','2027-12-25':'Navidad'};
const TIGHT=45; // minutos mínimos para trasladarse a/desde un terreno
const LS='horarioUA.v1';
const mq=matchMedia('(max-width:1023px)');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

const S={profile:{...DEFAULT_PROFILE},events:[],loaded:false,
  view:lsGet('horarioUA.v1.view','dia'),
  week:mondayOf(new Date()),sel:startOfDay(new Date()),mini:startOfDay(new Date()),
  hidden:new Set(lsGet(LS+'.hidden',[])),sessions:{},detail:null,db:null,mode:'local',grid:null,drag:null,syncOn:false,syncMsg:'Conectando…'};

/* ---------- tiempo ---------- */
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function mondayOf(d){const x=startOfDay(d);return addDays(x,-((x.getDay()+6)%7))}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseYmd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function toMin(t){if(!t)return 0;const[h,m]=String(t).split(':').map(Number);return h*60+(m||0)}
function fmtMin(m){m=Math.max(0,Math.min(1439,m));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function dur(m){const h=Math.floor(m/60),r=m%60;return h&&r?`${h} h ${r} min`:h?`${h} h`:`${r} min`}
function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes()}
function sameDay(a,b){return ymd(a)===ymd(b)}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function sd(d){return d.getDate()+' '+MSH[d.getMonth()]}
function dowOf(d){return d.getDay()===0?7:d.getDay()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function ico(n){return `<svg class="i"><use href="#i-${n}"/></svg>`}
function initials(n){const p=String(n).trim().split(/\s+/);return(((p[0]||'')[0]||'')+((p.length>2?p[p.length-2]:p[1]||'')[0]||'')).toUpperCase()}

/* ---------- datos ---------- */
function occursOn(e,date){
  if(!e.day||Number(e.day)!==dowOf(date))return false;
  const k=ymd(date);return !(e.dateFrom&&k<e.dateFrom)&&!(e.dateTo&&k>e.dateTo);
}
function eventsOn(date,all){return S.events.filter(e=>occursOn(e,date)&&(all||!S.hidden.has(e.kind||'otro'))).sort((a,b)=>toMin(a.start)-toMin(b.start)||toMin(a.end)-toMin(b.end))}
function skey(id,date){return id+'__'+ymd(date)}
function sessOf(id,date){return S.sessions[skey(id,date)]||null}
function stateOf(e,date){if(HOLIDAYS[ymd(date)])return 'feriado';const s=sessOf(e.id,date);return s&&s.status==='suspendida'?'suspendida':'ok'}
function activeOn(date){return eventsOn(date,true).filter(e=>stateOf(e,date)==='ok')}
function clashesOn(date){
  const l=activeOn(date),ids=new Set(),pairs=[];
  for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++){const a=l[i],b=l[j];const ov=Math.min(toMin(a.end),toMin(b.end))-Math.max(toMin(a.start),toMin(b.start));if(ov>0){ids.add(a.id);ids.add(b.id);pairs.push({a,b,ov,date})}}
  return{ids,pairs};
}
function tightOn(date){
  const l=activeOn(date),out=[];let prev=null;
  l.forEach(b=>{if(prev){const g=toMin(b.start)-toMin(prev.end);if(g>=0&&g<TIGHT&&(prev.place||'')!==(b.place||'')&&(prev.kind==='terreno'||b.kind==='terreno'))out.push({a:prev,b,g,date})}if(!prev||toMin(b.end)>toMin(prev.end))prev=b});
  return out;
}
function terrenoSessions(){
  const out=[],t=startOfDay(new Date());
  S.events.filter(e=>e.kind==='terreno'&&e.day&&e.dateFrom&&e.dateTo).forEach(e=>{
    for(let d=parseYmd(e.dateFrom);ymd(d)<=e.dateTo;d=addDays(d,1))if(occursOn(e,d)&&!HOLIDAYS[ymd(d)]){const s=sessOf(e.id,d);out.push({e,d,s,past:d<t||(sameDay(d,t)&&toMin(e.end)<=nowMin())})}
  });
  return out.sort((a,b)=>a.d-b.d||toMin(a.e.start)-toMin(b.e.start));
}
function gcalURL(e){
  const first=nextOccurrence(e)||(e.dateFrom?parseYmd(e.dateFrom):null);if(!first)return null;
  const f=(d,m)=>ymd(d).replace(/-/g,'')+'T'+fmtMin(m).replace(':','')+'00';
  const until=(e.dateTo||S.profile.semEnd||'').replace(/-/g,'');
  const q=new URLSearchParams({action:'TEMPLATE',text:e.title,dates:f(first,toMin(e.start))+'/'+f(first,toMin(e.end)),ctz:'America/Santiago',location:e.place||'',details:[KINDS[e.kind],e.group,e.note].filter(Boolean).join(' · ')});
  if(until)q.set('recur','RRULE:FREQ=WEEKLY;UNTIL='+until+'T235959Z');
  return 'https://calendar.google.com/calendar/render?'+q.toString();
}
function weekDays(){return Array.from({length:7},(_,i)=>addDays(S.week,i))}
function layoutDay(list){
  const out=[];let cl=[],end=-1;
  const flush=()=>{const cols=[];cl.forEach(e=>{let c=cols.findIndex(x=>x<=toMin(e.start));if(c<0){c=cols.length;cols.push(0)}cols[c]=toMin(e.end);e._c=c});cl.forEach(e=>{e._n=cols.length;out.push(e)});cl=[]};
  list.forEach(e=>{if(cl.length&&toMin(e.start)>=end){flush();end=-1}cl.push({...e});end=Math.max(end,toMin(e.end))});
  if(cl.length)flush();return out;
}
function nextOccurrence(e){
  if(!e.day)return null;const nm=nowMin(),t=startOfDay(new Date());
  for(let i=0;i<120;i++){const d=addDays(t,i);if(occursOn(e,d)&&(i>0||toMin(e.end)>nm))return d}
  return null;
}
function findNext(){
  const n=new Date(),nm=nowMin();
  for(let i=0;i<21;i++){const d=addDays(startOfDay(n),i);const l=activeOn(d).filter(e=>i>0||toMin(e.start)>nm);if(l.length){const at=new Date(d);at.setMinutes(toMin(l[0].start));return{ev:l[0],at}}}
  return null;
}

/* ---------- persistencia ---------- */
function lsGet(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function clean(e){const o={};for(const k of['title','kind','day','start','end','place','dateFrom','dateTo','group','people','emails','note','estEnd'])if(e[k]!==undefined&&e[k]!==''&&e[k]!==null&&!(Array.isArray(e[k])&&!e[k].length))o[k]=e[k];o.day=Number(o.day||0);o.kind=o.kind||'otro';return o}
function persistLocal(){lsSet(LS,{profile:S.profile,events:S.events,sessions:S.sessions})}
async function saveSession(key,data){
  S.sessions[key]={...data};render();
  if(S.mode==='db'){try{await S.db.collection('sessions').doc(key).set(S.sessions[key])}catch{toast('No se pudo guardar la sesión','Inténtalo otra vez.')}}
  else persistLocal();
}
async function saveEvent(ev){
  const id=ev.id||uid(),body=clean(ev),i=S.events.findIndex(x=>x.id===id);
  if(i>=0)S.events[i]={id,...body};else S.events.push({id,...body});
  render();
  if(S.mode==='db'){try{await S.db.collection('events').doc(id).set(body)}catch{toast('No se pudo guardar','Revisa tu conexión e inténtalo otra vez.')}}
  else persistLocal();
  return id;
}
async function deleteEvent(id){
  S.events=S.events.filter(e=>e.id!==id);render();
  if(S.mode==='db'){try{await S.db.collection('events').doc(id).delete()}catch{toast('No se pudo eliminar','Inténtalo otra vez.')}}
  else persistLocal();
}
async function saveProfile(p){
  S.profile={...S.profile,...p};render();
  if(S.mode==='db'){try{await S.db.doc('config/profile').set(S.profile)}catch{}}else persistLocal();
}
function setSync(on,msg){S.syncOn=on;S.syncMsg=msg||(on?'Sincronizado · PC y celular':'Guardado solo en este dispositivo');renderSide()}

async function boot(){
  const local=lsGet(LS,null);
  if(local){S.profile={...DEFAULT_PROFILE,...local.profile};S.events=local.events||[];S.sessions=local.sessions||{};S.loaded=true}
  render();
  let db=null;try{db=window.claude?.use?await window.claude.use('db'):null}catch{db=null}
  if(!db){S.loaded=true;setSync(false);render();return}
  S.db=db;S.mode='db';setSync(true);
  db.collection('events').onSnapshot(snap=>{S.events=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded=true;if(!S.drag)render()},()=>setSync(false,'Sin conexión con la nube'));
  db.collection('sessions').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>m[d.id]=d.data());S.sessions=m;if(!S.drag)render()},()=>{});
  db.doc('config/profile').onSnapshot(snap=>{if(snap.exists){S.profile={...DEFAULT_PROFILE,...snap.data()};if(!S.drag)render()}},()=>{});
}

/* ---------- render ---------- */
function go(fn){S.keepScroll=false;const run=()=>{fn();render()};if(document.startViewTransition&&!reduced)document.startViewTransition(run);else run()}
function render(){
  const sc=document.getElementById('scroller');
  const keep=sc&&S.keepScroll!==false&&S.view==='semana'&&S._wk===ymd(S.week)?sc.scrollTop:null;
  S.keepScroll=true;
  renderSide();renderTop();renderMetrics();
  const c=document.getElementById('content');
  if(!S.loaded){c.innerHTML='<div class="empty"><div class="e">⏳</div>Cargando tu horario…</div>';return}
  if(!S.events.length){c.innerHTML=`<div class="empty"><div class="e">${esc(S.profile.emoji)}</div><b style="color:var(--ink)">Tu horario está vacío</b><span>Crea tu primer bloque o deja que Claude ordene tu horario desde Ajustes → Nuevo semestre.</span><div class="dr-actions" style="justify-content:center"><button class="btn pri" data-act="new">${ico('plus')}Nuevo bloque</button><button class="btn" data-act="settings">${ico('spark')}Nuevo semestre</button></div></div>`;return}
  c.classList.toggle('narrow',S.view!=='semana');lsSet(LS+'.view',S.view);
  let html='';
  html+=S.view==='semana'?weekHTML():S.view==='dia'?dayHTML():agendaHTML();
  c.innerHTML=html;
  if(S.view==='semana'){S._wk=ymd(S.week);afterWeek(keep)}else S._wk=null;
}

function renderSide(){
  const al=alertsList(),pip=document.getElementById('pip');
  if(pip){pip.hidden=!al.length;pip.className='pip'+(al.some(a=>a.tone==='clash')?'':' soft')}
  const av=document.getElementById('avatar');if(av)av.textContent=S.profile.emoji||'🦉';
}
function alertsList(){
  const out=[],days=weekDays();
  S.events.filter(e=>!e.day).forEach(e=>out.push({tone:'info',t:'Falta asignar el día',s:e.title,id:e.id}));
  days.forEach(d=>clashesOn(d).pairs.forEach(c=>out.push({tone:'clash',t:`Choque · ${DAYS[d.getDay()].toLowerCase()} ${sd(d)}`,s:`${c.a.title} y ${c.b.title}`,id:c.b.id,date:ymd(d)})));
  days.forEach(d=>tightOn(d).forEach(t=>out.push({tone:'ter',t:`${t.g} min para llegar · ${DSH[d.getDay()].toLowerCase()} ${sd(d)}`,s:`${t.a.place||t.a.title} → ${t.b.place||t.b.title}`,id:t.b.id,date:ymd(d)})));
  days.filter(d=>HOLIDAYS[ymd(d)]&&dowOf(d)<=5).forEach(d=>out.push({tone:'info',t:`Feriado · ${DAYS[d.getDay()].toLowerCase()} ${sd(d)}`,s:HOLIDAYS[ymd(d)],jump:ymd(d)}));
  const pend=terrenoSessions().filter(x=>x.past&&!x.s);
  if(pend.length)out.push({tone:'info',t:`${pend.length} ${pend.length===1?'sesión':'sesiones'} de terreno por registrar`,s:'Asistencia y bitácora',id:pend[0].e.id,date:ymd(pend[0].d)});
  const wkEnd=ymd(addDays(S.week,6)),fut=S.events.filter(e=>e.kind==='terreno'&&e.dateFrom&&e.dateFrom>wkEnd).map(e=>e.dateFrom).sort();
  if(fut.length&&!days.some(d=>eventsOn(d,true).some(e=>e.kind==='terreno'))){const f=parseYmd(fut[0]);out.push({tone:'ter',t:`Terrenos desde el ${DAYS[f.getDay()].toLowerCase()} ${sd(f)}`,s:'Intervención con Grupos · 2 semanas',week:fut[0]})}
  return out;
}
function alertHTML(a){
  const attr=a.id?`data-open="${esc(a.id)}"${a.date?` data-date="${a.date}"`:''}`:a.week?`data-week="${a.week}"`:a.jump?`data-jump="${a.jump}"`:'';
  return `<button class="al ${a.tone}" ${attr}><i></i><span><b>${esc(a.t)}</b><small>${esc(a.s)}</small></span></button>`;
}
function semProgHTML(){
  const p=S.profile;if(!p.semStart||!p.semEnd)return '';
  const a=parseYmd(p.semStart),b=parseYmd(p.semEnd),t=startOfDay(new Date());
  const total=Math.max(1,Math.ceil((b-a)/(7*864e5))),cur=Math.max(0,Math.min(total,Math.floor((t-a)/(7*864e5))+1));
  return `<div class="prog"><div class="bar"><i style="width:${cur/total*100}%"></i></div><small><span>Semana ${cur} de ${total}</span><span>${t>b?'Terminado':`termina el ${sd(b)}`}</span></small></div>`;
}
function supHTML(){
  const l=terrenoSessions();if(!l.length)return '';
  const done=l.filter(x=>x.s&&x.s.status==='realizada').length,sus=l.filter(x=>x.s&&x.s.status==='suspendida').length,pend=l.filter(x=>x.past&&!x.s);
  return `<div class="sect"><div class="lbl" style="padding:0 8px 2px">Supervisión de terrenos</div><div class="prog" style="padding:0 8px"><small><span><b style="color:var(--ink)">${done}</b> de ${l.length} sesiones realizadas</span>${sus?`<span>${sus} suspendidas</span>`:''}</small><div class="bar"><i class="g" style="width:${done/l.length*100}%"></i></div>${pend.length?`<button class="btn" data-open="${esc(pend[0].e.id)}" data-date="${ymd(pend[0].d)}">Registrar ${pend.length} ${pend.length===1?'sesión pasada':'sesiones pasadas'}</button>`:`<small>Registra asistencia y bitácora desde cada terreno.</small>`}</div></div>`;
}
function filtersHTML(withCount){
  const counts={catedra:0,asesoria:0,terreno:0,otro:0};S.events.forEach(e=>counts[e.kind]!==undefined?counts[e.kind]++:counts.otro++);
  return Object.keys(KINDS).filter(k=>counts[k]||S.hidden.has(k)).map(k=>`<button class="filt${S.hidden.has(k)?' off':''}" data-filter="${k}" aria-pressed="${!S.hidden.has(k)}" style="--k:${KVAR[k]}"><span class="sw"></span>${KPLURAL[k]}${withCount?`<span class="n">${counts[k]}</span>`:''}</button>`).join('');
}

/* ---------- semana ---------- */
function weekHTML(){
  let dates=weekDays();if(!dates.slice(5).some(d=>eventsOn(d).length))dates=dates.slice(0,5);
  let lo=8*60,hi=22*60;S.events.forEach(e=>{if(e.day){lo=Math.min(lo,toMin(e.start));hi=Math.max(hi,toMin(e.end))}});
  lo=Math.floor(lo/60)*60;hi=Math.ceil(hi/60)*60;
  const H=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour'))||60;
  const px=m=>(m-lo)/60*H,total=px(hi),today=new Date();
  S.grid={lo,hi,H};
  const loads=dates.map(d=>activeOn(d).reduce((a,e)=>a+toMin(e.end)-toMin(e.start),0));
  let h=`<div class="board"><div class="scroller" id="scroller"><div class="grid" id="wgrid" style="grid-template-columns:var(--tc,56px) repeat(${dates.length},minmax(var(--cw,124px),1fr))"><div class="gh corner"></div>`;
  dates.forEach((d,i)=>{const hol=HOLIDAYS[ymd(d)];h+=`<button class="gh${sameDay(d,today)?' today':''}" data-jump="${ymd(d)}" title="Abrir ${DAYS[d.getDay()].toLowerCase()} ${sd(d)}${hol?' · Feriado: '+hol:''}"><div class="d"><small>${DSH[d.getDay()]}</small><b>${d.getDate()}</b></div>${hol?`<span class="hol">Feriado · ${esc(hol)}</span>`:`<span class="hrs">${loads[i]?dur(loads[i]):'Libre'}</span>`}</button>`});
  h+=`<div class="times" style="height:${total}px">`;for(let m=lo+60;m<hi;m+=60)h+=`<div style="top:${px(m)}px">${fmtMin(m)}</div>`;h+='</div>';
  dates.forEach(d=>{
    const{ids}=clashesOn(d),isT=sameDay(d,today);
    h+=`<div class="col${isT?' today':''}" data-date="${ymd(d)}" style="height:${total}px">`;
    layoutDay(eventsOn(d)).forEach(e=>{
      const st=stateOf(e,d),top=px(toMin(e.start)),hh=Math.max(px(toMin(e.end))-top-2,20),w=100/e._n,clash=ids.has(e.id),compact=hh<34,ses=sessOf(e.id,d);
      const tag=st==='feriado'?' · feriado':st==='suspendida'?' · suspendida':ses&&ses.status==='realizada'?' · realizada':'';
      h+=`<button class="ev ${KCLS[e.kind]||'ko'}${clash?' is-clash':''}${st!=='ok'?' off':''}${compact?' compact':''}${e._n>1?' split':''}" data-open="${esc(e.id)}" data-date="${ymd(d)}" style="top:${top+1}px;height:${hh}px;left:calc(${w*e._c}% + 3px);width:calc(${w}% - 6px)" title="${esc(e.title)} · ${esc(e.start)}–${esc(e.end)}${clash?' · choque de horario':''}${tag}">${clash?'<span class="badge">choque</span>':''}<span class="t">${ses&&ses.status==='realizada'?'✓ ':''}${esc(e.title)}</span><span class="h">${esc(e.start)}–${esc(e.end)}${e.estEnd?' ≈':''}</span>${hh>=58&&e.place?`<span class="p">${esc(e.place)}</span>`:''}<span class="rz" data-rz="1"></span></button>`;
    });
    if(isT){const nm=nowMin();if(nm>=lo&&nm<=hi)h+=`<div class="nowline" style="top:${px(nm)}px"></div>`}
    h+='</div>';
  });
  return h+'</div></div></div>';
}
function afterWeek(keep){
  const sc=document.getElementById('scroller');if(!sc||!S.grid)return;
  if(keep!=null){sc.scrollTop=keep;return}
  const starts=weekDays().flatMap(d=>eventsOn(d).map(e=>toMin(e.start)));
  const first=Math.min(...starts,sameDay(mondayOf(new Date()),S.week)?nowMin():1440);
  if(isFinite(first))sc.scrollTop=Math.max(0,(first-S.grid.lo-30)/60*S.grid.H);
}

function itemHTML(e,d,{clash,isT,nm}){
  const st=stateOf(e,d),ses=sessOf(e.id,d),done=ses&&ses.status==='realizada';
  const live=st==='ok'&&isT&&toMin(e.start)<=nm&&toMin(e.end)>nm,past=isT&&toMin(e.end)<=nm;
  const meta=[e.place,e.group,dur(toMin(e.end)-toMin(e.start))].filter(Boolean).map(esc).join(' · ');
  const tags=[];
  if(live)tags.push('<span class="n">Ahora</span>');
  if(clash)tags.push('<span class="c">Choque de horario</span>');
  if(st==='feriado')tags.push(`<span class="c">Feriado</span>`);
  if(st==='suspendida')tags.push('<span class="m">Suspendida</span>');
  if(done)tags.push(`<span class="g">Realizada${e.people?.length&&Array.isArray(ses.present)?` · ${ses.present.length}/${e.people.length} presentes`:''}</span>`);
  return `<button class="item ${KCLS[e.kind]||'ko'}${clash?' is-clash':''}${live?' live':''}${past&&!done?' past':''}${st!=='ok'?' off':''}" data-open="${esc(e.id)}" data-date="${ymd(d)}">
    <div class="tm">${esc(e.start)}<small>${esc(e.end)}</small></div>
    <div style="min-width:0"><div class="ti">${esc(e.title)}</div><div class="meta">${meta}</div>${tags.length?`<div class="st">${tags.join('')}</div>`:''}</div>
    <span class="chev">${ico('r')}</span></button>`;
}
function sepHTML(prev,e,d,tight){
  const g=toMin(e.start)-toMin(prev.end),t=tight.find(x=>x.b.id===e.id);
  if(t)return `<div class="free tight">${ico('warn')}${t.g} min para llegar a ${esc(e.place||e.title)}</div>`;

function dayHTML(){

    h+=`<button data-day="${ymd(d)}" aria-pressed="${sameDay(d,S.sel)}" aria-label="${DAYS[d.getDay()]} ${d.getDate()}">${sameDay(d,today)?'<span class="tdot"></span>':''}<small>${DSH[d.getDay()]}</small><b>${d.getDate()}</b><span class="dots">${k.map(x=>`<i style="background:${KVAR[x]||KVAR.otro}"></i>`).join('')}${cl?'<i style="background:var(--clash)"></i>':''}</span></button>`});
  h+='</div>';
  const l=eventsOn(S.sel),{ids}=clashesOn(S.sel),isT=sameDay(S.sel,today),nm=nowMin(),tot=l.filter(e=>stateOf(e,S.sel)==='ok').reduce((a,e)=>a+toMin(e.end)-toMin(e.start),0);

  const tight=tightOn(S.sel);

function agendaHTML(){
  const t=startOfDay(new Date()),start=S.week<=t&&addDays(S.week,7)>t?t:S.week,nm=nowMin();
  let h='<div class="agenda">',any=false;
  for(let i=0;i<21;i++){

    const o=S.events.filter(x=>x.id!==e.id&&Number(x.day)===t.day&&toMin(x.start)<toMin(t.end)&&toMin(t.start)<toMin(x.end)&&!(t.to&&x.dateFrom&&x.dateFrom>t.to)&&!(t.from&&x.dateTo&&x.dateTo<t.from));

  };

    const out={...e,title:f['f-title'].value.trim(),kind:f.kind.value,day:Number(f['f-day'].value),place:f['f-place'].value.trim(),start:f['f-start'].value,end:f['f-end'].value,dateFrom:f['f-from'].value,dateTo:f['f-to'].value,group:f['f-group'].value.trim(),people:f['f-people'].value.split('\n').map(s=>s.trim()).filter(Boolean),emails:f['f-emails'].value.split('\n').map(s=>s.trim()).filter(Boolean),note:f['f-note'].value.trim()};

async function fileToText(file){
  if(/\.docx$/i.test(file.name)){
    if(!window.JSZip)throw new Error('nozip');
    const zip=await JSZip.loadAsync(await file.arrayBuffer());
    const xml=await zip.file('word/document.xml').async('string');
    return xml.replace(/<\/w:tc>/g,' | ').replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,' ').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\n{3,}/g,'\n\n').trim();
  }
  return await file.text();
}

Reglas: un objeto por bloque y por día (dos bloques = dos objetos). Horas en 24 h con dos dígitos. Si falta la hora de término, asume 45 minutos para terrenos u 80 minutos para clases y marca estEnd. "catedra" = clases o asignaturas; "asesoria" = asesorías o supervisión de práctica; "terreno" = visitas o salidas a terreno. Hoy es ${ymd(new Date())}.
Horario:
"""${txt.slice(0,20000)}"""`;
  try{const res=await sample.json(instr,{modelTier:'default'});const evs=(res&&res.events)||[];if(!evs.length)throw new Error('empty');showPreview(evs,`Claude encontró ${evs.length} bloques`)}

function normalize(evs){
  return evs.map(e=>({title:String(e.title||'Sin nombre'),kind:KINDS[e.kind]?e.kind:'otro',day:Math.max(0,Math.min(7,Number(e.day)||0)),start:String(e.start||'').slice(0,5).padStart(5,'0'),end:String(e.end||'').slice(0,5).padStart(5,'0'),place:e.place||'',dateFrom:e.dateFrom||'',dateTo:e.dateTo||'',group:e.group||'',people:Array.isArray(e.people)?e.people.map(String):undefined,note:e.note||'',estEnd:e.estEnd?true:undefined})).filter(e=>/^\d\d:\d\d$/.test(e.start)&&/^\d\d:\d\d$/.test(e.end));
}
function showPreview(raw,label){

async function bulk(evs,replace){
  if(S.mode==='db'){if(replace)for(const e of[...S.events])await S.db.collection('events').doc(e.id).delete();for(const e of evs)await S.db.collection('events').doc(uid()).set(clean(e))}
  else{if(replace)S.events=[];evs.forEach(e=>S.events.push({id:uid(),...clean(e)}));persistLocal();render()}
}

/* ---------- .ics ---------- */
function buildICS(){
  const p=S.profile,L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mi Horario UA//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Horario UA'];
  const ie=s=>String(s||'').replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const dt=(d,m)=>ymd(d).replace(/-/g,'')+'T'+fmtMin(m).replace(':','')+'00';
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  S.events.filter(e=>e.day).forEach(e=>{
    const to=e.dateTo||p.semEnd;let first=parseYmd(e.dateFrom||p.semStart||ymd(new Date()));
    while(dowOf(first)!==Number(e.day))first=addDays(first,1);
    if(to&&ymd(first)>to)return;
    const sm=toMin(e.start),em=toMin(e.end),eve=sm+180;
    L.push('BEGIN:VEVENT','UID:'+e.id+'@horario-ua','DTSTAMP:'+stamp,'DTSTART:'+dt(first,sm),'DTEND:'+dt(first,em));
    if(to){L.push('RRULE:FREQ=WEEKLY;UNTIL='+to.replace(/-/g,'')+'T235959');
      const ex=[];for(let d=new Date(first);ymd(d)<=to;d=addDays(d,7))if(stateOf(e,d)!=='ok')ex.push(dt(d,sm));
      if(ex.length)L.push('EXDATE:'+ex.join(','))}
    L.push('SUMMARY:'+ie(e.title),'LOCATION:'+ie(e.place),'DESCRIPTION:'+ie([KINDS[e.kind],e.group,(e.people||[]).join(', '),e.note].filter(Boolean).join('\n')));
    if(p.notify20!==false)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+ie('En 20 min: '+e.title),'TRIGGER:-PT20M','END:VALARM');
    if(p.notifyEve!==false)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+ie('Mañana: '+e.title+' '+e.start),'TRIGGER:-PT'+Math.floor(eve/60)+'H'+(eve%60)+'M','END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');return L.join('\r\n');
}
async function download(name,data,type){
  let dl=null;try{dl=window.claude?.use?await window.claude.use('downloads'):null}catch{}
  if(!dl){toast('Descarga no disponible aquí','Abre la página en claude.ai para descargar el archivo.');return}
  try{const r=await dl.save({filename:name,data:new Blob([data],{type})});if(r&&r.status==='saved')toast('Archivo listo',name)}catch(e){if(e&&e.code!=='cancelled'&&e.code!=='declined')toast('No se pudo descargar','Inténtalo otra vez.')}
}

function notify(title,body){
  toast(title,body);
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body})}catch{}

}
function tick(){
  const p=S.profile,n=new Date(),k=ymd(n),seen=lsGet(LS+'.seen',{}),nm=nowMin();let ch=false;
  if(p.notify20!==false)activeOn(n).forEach(e=>{const d=toMin(e.start)-nm,key='20:'+k+':'+e.id;if(d>0&&d<=20&&!seen[key]){seen[key]=1;ch=true;notify(`En ${d} min: ${e.title}`,`${e.start}–${e.end}${e.place?' · '+e.place:''}`)}});
  if(p.notifyEve!==false&&n.getHours()>=21&&!seen['eve:'+k]){seen['eve:'+k]=1;ch=true;const t=addDays(startOfDay(n),1),l=activeOn(t),cl=clashesOn(t).pairs.length,tg=tightOn(t).length;
    if(l.length)notify(`Mañana ${DAYS[t.getDay()].toLowerCase()}: ${l.length} ${l.length===1?'bloque':'bloques'} ${p.emoji||''}`,l.map(e=>`${e.start} ${e.title}`).join(' · ')+(cl?` · ${cl} choque${cl>1?'s':''}`:'')+(tg?` · ${tg} traslado${tg>1?'s':''} ajustado${tg>1?'s':''}`:''))}
  if(ch){const y=ymd(addDays(n,-1));Object.keys(seen).forEach(x=>{if(!x.includes(k)&&!x.includes(y))delete seen[x]});lsSet(LS+'.seen',seen)}
}

function openPalette(){
  const L=document.getElementById('layer');
  L.innerHTML=`<div class="scrim" data-close style="background:rgba(8,9,12,.3)"></div><div class="pal" role="dialog" aria-modal="true" aria-label="Buscar"><div class="pal-in">${ico('search')}<input id="pal-q" placeholder="Busca un ramo, sala, grupo, estudiante o acción…" autocomplete="off"><kbd>Esc</kbd></div><div class="pal-l" id="pal-l" role="listbox"></div><div class="pal-f"><span><kbd>↑</kbd><kbd>↓</kbd> moverse</span><span><kbd>↵</kbd> abrir</span><span><kbd>N</kbd> nuevo · <kbd>T</kbd> hoy · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> vistas</span></div></div>`;
  const q=document.getElementById('pal-q'),list=document.getElementById('pal-l');let items=[],idx=0;
  const toWeek=f=>go(()=>{S.week=mondayOf(parseYmd(f));S.sel=S.week;S.mini=S.week});
  const actions=[
    {g:'Acciones',t:'Nuevo bloque',k:'N',run:()=>openEditor(null)},
    {g:'Acciones',t:'Ir a hoy',k:'T',run:()=>go(()=>{S.week=mondayOf(new Date());S.sel=startOfDay(new Date());S.mini=S.sel})},
    {g:'Acciones',t:'Vista semana',k:'1',run:()=>go(()=>S.view='semana')},
    {g:'Acciones',t:'Vista día',k:'2',run:()=>go(()=>S.view='dia')},
    {g:'Acciones',t:'Vista agenda',k:'3',run:()=>go(()=>S.view='agenda')},
    {g:'Acciones',t:'Ver semana de terrenos',run:()=>{const f=S.events.filter(e=>e.kind==='terreno'&&e.dateFrom).map(e=>e.dateFrom).sort()[0];if(f)toWeek(f)}},
    {g:'Acciones',t:'Descargar calendario (.ics)',run:()=>download('horario-ua.ics',buildICS(),'text/calendar')},
    {g:'Acciones',t:'Nuevo semestre con Claude',run:()=>openSettings()},
    {g:'Acciones',t:'Ajustes',run:()=>openSettings()},
  ];
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const draw=()=>{
    const s=norm(q.value.trim());
    const evs=S.events.filter(e=>!s||norm([e.title,e.place,e.group,KINDS[e.kind],(e.people||[]).join(' '),(e.emails||[]).join(' '),e.day?DAYS[e.day%7]:''].join(' ')).includes(s)).sort((a,b)=>(a.day||9)-(b.day||9)||toMin(a.start)-toMin(b.start)).slice(0,14)
      .map(e=>{const nx=nextOccurrence(e),who=s&&(e.people||[]).find(p=>norm(p).includes(s));return{g:'Bloques',t:e.title,dot:KVAR[e.kind]||KVAR.otro,sub:(who?who+' · ':'')+(e.day?DSH[e.day%7]+' '+e.start:'Día por confirmar'),run:()=>openDetail(e.id,nx?ymd(nx):null)}});
    items=[...actions.filter(a=>!s||norm(a.t).includes(s)),...evs];idx=Math.min(idx,Math.max(0,items.length-1));
    let g='';list.innerHTML=items.length?items.map((it,i)=>{const head=it.g!==g?`<div class="pal-g">${it.g}</div>`:'';g=it.g;return head+`<button class="pal-i" role="option" data-i="${i}" aria-selected="${i===idx}">${it.dot?`<span class="dot" style="--k:${it.dot}"></span>`:ico('r')}<span>${esc(it.t)}</span><small>${it.k?`<kbd>${it.k}</kbd>`:esc(it.sub||'')}</small></button>`}).join(''):`<div class="pal-g">Sin resultados</div>`;
  };
  const pick=i=>{const it=items[i];if(!it)return;closeLayer();it.run()};
  const move=dlt=>{idx=Math.max(0,Math.min(items.length-1,idx+dlt));draw();list.querySelector('[aria-selected="true"]')?.scrollIntoView({block:'nearest'})};
  q.addEventListener('input',()=>{idx=0;draw()});
  q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){move(1);e.preventDefault()}else if(e.key==='ArrowUp'){move(-1);e.preventDefault()}else if(e.key==='Enter'){pick(idx);e.preventDefault()}});
  list.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)pick(+b.dataset.i)});
  draw();setTimeout(()=>q.focus(),30);
}

let suppressClick=false;
function colAt(x){return[...document.querySelectorAll('#wgrid .col')].find(c=>{const r=c.getBoundingClientRect();return x>=r.left&&x<r.right})}
function minAt(col,y){const r=col.getBoundingClientRect(),g=S.grid;return Math.round(((y-r.top)/g.H*60+g.lo)/5)*5}
document.addEventListener('pointerdown',e=>{
  if(S.view!=='semana'||e.pointerType==='touch'||e.button!==0||!S.grid)return;
  const evEl=e.target.closest('#wgrid .ev'),col=e.target.closest('#wgrid .col');
  if(evEl){const ev=S.events.find(x=>x.id===evEl.dataset.open);if(!ev)return;
    S.drag={type:e.target.dataset.rz?'resize':'move',ev,el:evEl,x0:e.clientX,y0:e.clientY,moved:false,s:toMin(ev.start),en:toMin(ev.end),offset:minAt(evEl.parentElement,e.clientY)-toMin(ev.start)}}
  else if(col){S.drag={type:'create',col,x0:e.clientX,y0:e.clientY,moved:false,m0:minAt(col,e.clientY)}}
});
document.addEventListener('pointermove',e=>{
  const d=S.drag;if(!d)return;
  if(!d.moved&&Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<5)return;
  if(!d.moved){d.moved=true;document.body.style.userSelect='none';if(d.el)d.el.classList.add('dragging')}
  const g=S.grid,dl=d.en-d.s;
  if(d.type==='move'){
    const col=colAt(e.clientX)||d.el.parentElement;
    const ns=Math.max(g.lo,Math.min(g.hi-dl,minAt(col,e.clientY)-d.offset));
    if(d.el.parentElement!==col)col.appendChild(d.el);
    Object.assign(d.el.style,{top:((ns-g.lo)/60*g.H+1)+'px',left:'3px',width:'calc(100% - 6px)'});
    d.ns=ns;d.nd=dowOf(parseYmd(col.dataset.date));
    d.el.querySelector('.h').textContent=`${fmtMin(ns)}–${fmtMin(ns+dl)}`;
  }else if(d.type==='resize'){
    const ne=Math.max(d.s+15,Math.min(g.hi,minAt(d.el.parentElement,e.clientY)));
    d.ne=ne;d.el.style.height=((ne-d.s)/60*g.H-2)+'px';d.el.querySelector('.h').textContent=`${fmtMin(d.s)}–${fmtMin(ne)}`;
  }else{
    const m1=minAt(d.col,e.clientY),a=Math.max(g.lo,Math.min(d.m0,m1)),b=Math.min(g.hi,Math.max(d.m0,m1,a+15));
    if(!d.ghost){d.ghost=document.createElement('div');d.ghost.className='ev ghost';d.col.appendChild(d.ghost)}
    d.ghost.style.cssText=`top:${(a-g.lo)/60*g.H+1}px;height:${(b-a)/60*g.H-2}px;left:3px;width:calc(100% - 6px)`;
    d.ghost.innerHTML=`<span class="t">Nuevo bloque</span><span class="h">${fmtMin(a)}–${fmtMin(b)}</span>`;d.a=a;d.b=b;
  }
});
document.addEventListener('pointerup',async()=>{
  const d=S.drag;if(!d)return;S.drag=null;document.body.style.userSelect='';
  if(!d.moved)return;
  suppressClick=true;setTimeout(()=>suppressClick=false,0);
  if(d.type==='create'){d.ghost?.remove();openEditor(null,{day:dowOf(parseYmd(d.col.dataset.date)),start:fmtMin(d.a),end:fmtMin(d.b)});return}
  const prev={...d.ev};let next={...d.ev};
  if(d.type==='move'&&d.ns!=null)next={...next,day:d.nd,start:fmtMin(d.ns),end:fmtMin(d.ns+(d.en-d.s))};
  if(d.type==='resize'&&d.ne!=null)next={...next,end:fmtMin(d.ne)};
  if(next.start===prev.start&&next.end===prev.end&&Number(next.day)===Number(prev.day)){render();return}
  delete next.estEnd;
  await saveEvent(next);
  toast(d.type==='move'?'Bloque movido':'Duración ajustada',`${next.title}: ${DSH[next.day%7]} ${next.start}–${next.end}`,()=>saveEvent(prev));
});

/* ---------- clics y teclado ---------- */
document.addEventListener('click',e=>{
  if(suppressClick){e.preventDefault();e.stopPropagation();return}
  const t=e.target.closest('button,[data-close]');if(!t)return;
  if(t.matches('[data-close]')){closeLayer();return}
  if(t.closest('.pal'))return;
  const ds=t.dataset;
  if(ds.view){go(()=>S.view=ds.view);return}
  if(ds.tab==='ajustes'){openSettings();return}
  if(ds.open){if(t.closest('.drawer')&&!t.closest('.dr-actions'))closeLayer();openDetail(ds.open,ds.date);return}
  if(ds.filter){S.hidden.has(ds.filter)?S.hidden.delete(ds.filter):S.hidden.add(ds.filter);lsSet(LS+'.hidden',[...S.hidden]);render();if(t.closest('.drawer'))openMini();return}
  if(ds.pick){const d=parseYmd(ds.pick);go(()=>{S.week=mondayOf(d);S.sel=d;S.mini=d});if(t.closest('.drawer'))closeLayer();return}
  if(ds.mini){S.mini=new Date(S.mini.getFullYear(),S.mini.getMonth()+Number(ds.mini),1);t.closest('.drawer')?openMini():renderSide();return}
  if(ds.day){S.sel=parseYmd(ds.day);render();return}
  if(ds.jump){if(t.closest('.drawer'))closeLayer();const d=parseYmd(ds.jump);go(()=>{S.sel=d;S.week=mondayOf(d);S.view='dia'});return}
  if(ds.week){if(t.closest('.drawer'))closeLayer();go(()=>{S.week=mondayOf(parseYmd(ds.week));S.sel=S.week;S.mini=S.week});return}
  if(ds.emoji)return;
  if(ds.st&&S.detail?.date){const{id,date}=S.detail,d=parseYmd(date),k=skey(id,d),cur=S.sessions[k]||{eventId:id,date,status:'pendiente'};
    const note=document.getElementById('sess-note');saveSession(k,{...cur,eventId:id,date,status:ds.st,note:note?note.value.trim():cur.note||''});
    document.querySelectorAll('[data-st]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.st===ds.st));
    if(ds.st!=='pendiente')toast(ds.st==='realizada'?'Sesión realizada':'Sesión suspendida',`${S.events.find(x=>x.id===id)?.title||''} · ${sd(d)}`,()=>saveSession(k,cur));return}
  switch(ds.act){
    case 'new':openEditor(null);return;
    case 'settings':openSettings();return;
    case 'alerts':{const al=alertsList();openDrawer('Avisos',(al.length?`<div class="sect">${al.map(alertHTML).join('')}</div>`:'<div class="calm">Todo en orden esta semana</div>')+supHTML());return}
    case 'suspend':{const d=parseYmd(ds.date),k=skey(ds.id,d),cur=S.sessions[k]||null,ev=S.events.find(x=>x.id===ds.id);
      saveSession(k,{...(cur||{}),eventId:ds.id,date:ds.date,status:'suspendida'});const back=S.detail;if(back)openDetail(back.id,back.date);
      toast('Suspendido solo ese día',`${ev?.title||''} · ${DAYS[d.getDay()].toLowerCase()} ${sd(d)}`,()=>{cur?saveSession(k,cur):saveSession(k,{eventId:ds.id,date:ds.date,status:'pendiente'});if(back)openDetail(back.id,back.date)});return}
    case 'mails':{const ev=S.events.find(x=>x.id===ds.id),txt=(ev?.emails||[]).join(', ');
      const fallback=()=>{const box=document.getElementById('mailbox');box.innerHTML=`<label class="f">Correos del grupo<textarea readonly>${esc(txt)}</textarea></label>`;const ta=box.querySelector('textarea');ta.focus();ta.select()};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Correos copiados',`${ev.emails.length} correos de ${ev.group||ev.title}`),fallback)}catch{fallback()}return}
    case 'edit':openEditor(S.events.find(x=>x.id===ds.id));return;
    case 'dup':{const s=S.events.find(x=>x.id===ds.id);if(s){const{id,...rest}=s;openEditor(null,{...rest,title:rest.title+' (copia)'})}return}
    case 'del':{if(!t.classList.contains('arm')){t.classList.add('arm');t.textContent='¿Eliminar? Toca otra vez';setTimeout(()=>{if(t.isConnected){t.classList.remove('arm');t.textContent='Eliminar'}},3500);return}
      const prev=S.events.find(x=>x.id===ds.id);closeLayer();deleteEvent(ds.id);if(prev)toast('Bloque eliminado',prev.title,()=>saveEvent(prev));return}
  }
  switch(t.id){
    case 'prev':go(()=>{S.week=addDays(S.week,-7);S.sel=addDays(S.sel,-7);S.mini=S.week});break;
    case 'next':go(()=>{S.week=addDays(S.week,7);S.sel=addDays(S.sel,7);S.mini=S.week});break;
    case 'goToday':go(()=>{S.week=mondayOf(new Date());S.sel=startOfDay(new Date());S.mini=S.sel});break;
    case 'addBtn':case 'fab':openEditor(null);break;
    case 'setBtn':openSettings();break;
    case 'openPal':openPalette();break;
    case 'wktitle':openMini();break;
    case 'avatar':case 'avatar-m':{const i=EMOJIS.indexOf(S.profile.emoji);popAvatar();saveProfile({emoji:EMOJIS[(i+1)%EMOJIS.length]});break}
  }
});
document.addEventListener('change',e=>{
  const c=e.target.closest('[data-att]');if(!c||!S.detail?.date)return;
  const{id,date}=S.detail,d=parseYmd(date),k=skey(id,d),cur=S.sessions[k]||{eventId:id,date,status:'pendiente'};
  const present=[...document.querySelectorAll('[data-att]')].filter(x=>x.checked).map(x=>x.dataset.att);
  const ev=S.events.find(x=>x.id===id),status=cur.status==='pendiente'&&present.length?'realizada':cur.status;
  saveSession(k,{...cur,eventId:id,date,present,status});
  document.querySelectorAll('[data-st]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.st===status));
  const cnt=document.getElementById('att-count');if(cnt)cnt.textContent=`${present.length}/${ev?.people?.length||0} presentes`;
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
  if(e.key==='Escape'){closeLayer();return}
  if(e.target.closest('input,textarea,select')||document.getElementById('layer').children.length||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='/'){e.preventDefault();openPalette()}
  else if(k==='n'){e.preventDefault();openEditor(null)}
  else if(k==='t')go(()=>{S.week=mondayOf(new Date());S.sel=startOfDay(new Date());S.mini=S.sel});
  else if(k==='arrowleft'||k==='j')go(()=>{S.week=addDays(S.week,-7);S.sel=addDays(S.sel,-7);S.mini=S.week});
  else if(k==='arrowright'||k==='k')go(()=>{S.week=addDays(S.week,7);S.sel=addDays(S.sel,7);S.mini=S.week});
  else if(k==='1')go(()=>S.view='semana');else if(k==='2')go(()=>S.view='dia');else if(k==='3')go(()=>S.view='agenda');
});
// deslizar entre días en el celular
let tx=null,ty=null;
const content=document.getElementById('content');
content.addEventListener('touchstart',e=>{if(S.view==='dia'){tx=e.touches[0].clientX;ty=e.touches[0].clientY}},{passive:true});
content.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){let i=Math.round((S.sel-S.week)/864e5)+(dx<0?1:-1);go(()=>{if(i>6){S.week=addDays(S.week,7);i=0}if(i<0){S.week=addDays(S.week,-7);i=6}S.sel=addDays(S.week,i)})}});
mq.addEventListener?.('change',render);

boot();
setTimeout(()=>{if(!mq.matches&&S.events.length&&!lsGet(LS+'.hint',false)){lsSet(LS+'.hint',true);toast('Tip','Arrastra un bloque para moverlo o sobre un espacio vacío para crear uno. ⌘K para buscar.')}},2500);
setInterval(()=>{if(!S.drag){render();tick()}},30000);
setTimeout(tick,1500);
})();
</script>
