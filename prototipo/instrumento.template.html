<title>Instrumento CCAA</title>

<style>
/* ═══════════════════════════════════════════════════════════════════
   Sistema

   La referencia no es un documento académico sino una herramienta de
   trabajo: densa, precisa y sin adornos. La profundidad viene de líneas
   de un píxel y de superficies que se distinguen apenas, no de sombras.
   El color se reserva; casi todo el tablero es tinta sobre blanco.
   ═══════════════════════════════════════════════════════════════════ */

:root {
  /* Grises con un sesgo frío mínimo: hacen que el rojo institucional
     se lea más profundo de lo que es. */
  --fondo:      #f4f5f7;
  --panel:      #ffffff;
  --panel-2:    #f8f9fa;
  --panel-3:    #f1f3f5;
  --linea:      #e4e6ea;
  --linea-2:    #d0d4da;
  --tinta:      #0e1014;
  --tinta-2:    #545b66;
  --tinta-3:    #858c98;

  --marca:      #9e1b32;
  --marca-2:    #7d1427;
  --marca-velo: #fdf2f4;

  /* Escala de severidad. El color nunca va solo: cada celda lleva su
     puntaje y un medidor de tres segmentos, así que quien no distingue
     rojo y verde sigue leyendo la misma información. */
  --ok:         #10714f;
  --ok-velo:    #eefaf4;
  --ok-linea:   #c6ead9;
  --medio:      #96660a;
  --medio-velo: #fdf6e8;
  --medio-linea:#f0dfb4;
  --bajo:       #bb2637;
  --bajo-velo:  #fdf1f2;
  --bajo-linea: #f3d0d4;

  --foco:       #9e1b32;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark;
    --fondo: #0b0c0f; --panel: #131519; --panel-2: #181b20; --panel-3: #1e2127;
    --linea: #24272e; --linea-2: #343841;
    --tinta: #eceef2; --tinta-2: #9aa1ad; --tinta-3: #6b7280;
    --marca: #ef6d7f; --marca-2: #f79aa6; --marca-velo: #24151a;
    --ok: #46b98b; --ok-velo: #10241d; --ok-linea: #1d3a30;
    --medio: #d9a63f; --medio-velo: #241d0e; --medio-linea: #3c3117;
    --bajo: #f0707e; --bajo-velo: #241418; --bajo-linea: #3d2027;
    --foco: #ef6d7f;
  }
}
:root[data-theme="dark"] { color-scheme: dark;
  --fondo: #0b0c0f; --panel: #131519; --panel-2: #181b20; --panel-3: #1e2127;
  --linea: #24272e; --linea-2: #343841;
  --tinta: #eceef2; --tinta-2: #9aa1ad; --tinta-3: #6b7280;
  --marca: #ef6d7f; --marca-2: #f79aa6; --marca-velo: #24151a;
  --ok: #46b98b; --ok-velo: #10241d; --ok-linea: #1d3a30;
  --medio: #d9a63f; --medio-velo: #241d0e; --medio-linea: #3c3117;
  --bajo: #f0707e; --bajo-velo: #241418; --bajo-linea: #3d2027;
  --foco: #ef6d7f;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--fondo);
  color: var(--tinta);
  font-family: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-size: .875rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.021em; text-wrap: balance; line-height: 1.22; }
p, ul, ol { margin: 0; }
ul { padding: 0; list-style: none; }
button, input, textarea { font: inherit; color: inherit; }

:where(a, button, [tabindex], summary, input, textarea):focus-visible {
  outline: 2px solid var(--foco);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ── Tipografía ─────────────────────────────────────────────── */
.mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }
.d1   { font-size: 2.125rem; letter-spacing: -.028em; }
.d2   { font-size: 1.625rem; letter-spacing: -.024em; }
.d3   { font-size: 1.25rem; }
.t16  { font-size: 1rem; }
.t13  { font-size: .8125rem; }
.t12  { font-size: .75rem; line-height: 1.45; }
.sec  { color: var(--tinta-2); }
.ter  { color: var(--tinta-3); }
.med  { font-weight: 500; }

/* Rótulo: el mismo objeto tipográfico en toda la aplicación. */
.rot {
  font-family: "Geist Mono", ui-monospace, monospace;
  font-size: .6875rem;
  font-weight: 500;
  letter-spacing: .085em;
  text-transform: uppercase;
  color: var(--tinta-3);
}

/* ── Composición ────────────────────────────────────────────── */
.pila  { display: flex; flex-direction: column; }
.fila  { display: flex; align-items: center; flex-wrap: wrap; }
.alto  { align-items: flex-start; }
.entre { justify-content: space-between; }
.crece { flex: 1; min-width: 0; }
.g4 { gap: 4px } .g6 { gap: 6px } .g8 { gap: 8px } .g10 { gap: 10px }
.g12 { gap: 12px } .g16 { gap: 16px } .g20 { gap: 20px } .g24 { gap: 24px } .g32 { gap: 32px }

/* ── Cáscara ────────────────────────────────────────────────── */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }

.lateral {
  position: sticky; top: 0; align-self: start;
  display: flex; flex-direction: column; gap: 24px;
  height: 100vh; padding: 16px 12px;
  background: var(--panel);
  border-right: 1px solid var(--linea);
}

.marca { display: flex; align-items: center; gap: 10px; padding: 4px 8px 0; }
.marca img { display: block; width: 34px; height: 34px; object-fit: contain; }
.marca b { display: block; font-size: .8125rem; font-weight: 600; letter-spacing: -.01em; }
.marca span { display: block; font-size: .6875rem; color: var(--tinta-3); }

.grupo { display: flex; flex-direction: column; gap: 1px; }
.grupo > .rot { padding: 0 8px 6px; }

.nav {
  display: flex; align-items: center; gap: 9px;
  width: 100%; padding: 7px 9px;
  border: 0; border-radius: 6px;
  background: transparent; color: var(--tinta-2);
  font-size: .8125rem; text-align: left; cursor: pointer;
  transition: background .12s, color .12s;
}
.nav:hover { background: var(--panel-3); color: var(--tinta); }
.nav[aria-current="page"] { background: var(--panel-3); color: var(--tinta); font-weight: 500; }
.nav svg { flex: none; opacity: .75; }
.nav .cola { margin-left: auto; }

/* Punto de estado en la navegación: dice que ahí hay algo que mirar. */
.pip { width: 6px; height: 6px; border-radius: 2px; flex: none; }

.lateral-pie { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
.quien { display: flex; align-items: center; gap: 9px; padding: 8px 9px; border-top: 1px solid var(--linea); margin-top: 6px; }
.avatar {
  width: 25px; height: 25px; border-radius: 6px; flex: none;
  display: grid; place-items: center;
  background: var(--marca); color: #fff;
  font-family: "Geist Mono", monospace; font-size: .625rem; font-weight: 500;
}
:root[data-theme="dark"] .avatar { color: #1a0d10; }

.tabla-sup {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  height: 49px; padding: 0 28px;
  background: color-mix(in srgb, var(--fondo) 82%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--linea);
}
.miga { display: flex; align-items: center; gap: 8px; font-size: .8125rem; color: var(--tinta-3); min-width: 0; }
.miga b { font-weight: 500; color: var(--tinta); }
.miga i { font-style: normal; color: var(--linea-2); }

.lienzo { min-width: 0; }
.hoja { max-width: 1080px; padding: 28px 28px 96px; }

/* ── Superficies ────────────────────────────────────────────── */
.panel { background: var(--panel); border: 1px solid var(--linea); border-radius: 10px; }
.p16 { padding: 16px } .p20 { padding: 20px } .p24 { padding: 24px }

/* Encabezado interno: título, apoyo y una regla que separa del contenido. */
.panel-cab { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px 16px; padding: 16px 20px; border-bottom: 1px solid var(--linea); }
.panel-cab .crece { min-width: 220px; }
.panel-cab h2 { font-size: .9375rem; }
.panel-cab .apoyo { margin-top: 3px; font-size: .75rem; color: var(--tinta-3); }
.panel-cpo { padding: 20px; }
.regla { border-top: 1px solid var(--linea); }

/* ── Controles ──────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border-radius: 7px;
  border: 1px solid transparent;
  font-size: .8125rem; font-weight: 500; white-space: nowrap; cursor: pointer;
  transition: background .12s, border-color .12s, color .12s, opacity .12s;
}
.btn-p { background: var(--tinta); color: var(--panel); }
.btn-p:hover { background: color-mix(in srgb, var(--tinta) 86%, var(--fondo)); }
.btn-s { background: var(--panel); border-color: var(--linea-2); color: var(--tinta); }
.btn-s:hover { background: var(--panel-2); border-color: var(--tinta-3); }
.btn-f { background: transparent; color: var(--tinta-2); }
.btn-f:hover { background: var(--panel-3); color: var(--tinta); }
.btn-xs { padding: 5px 10px; font-size: .75rem; }
.btn:disabled { cursor: default; opacity: .6; }

.campo {
  padding: 7px 11px; border-radius: 7px;
  border: 1px solid var(--linea-2); background: var(--panel-2);
  font-size: .8125rem; color: var(--tinta-2);
}
textarea.campo { color: var(--tinta); resize: vertical; width: 100%; }

/* Distintivo: siempre lleva palabra, nunca sólo color. */
.dist {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 5px;
  border: 1px solid var(--linea);
  background: var(--panel-2);
  font-size: .6875rem; font-weight: 500; color: var(--tinta-2); white-space: nowrap;
}
.dist-ok    { background: var(--ok-velo);    border-color: var(--ok-linea);    color: var(--ok); }
.dist-medio { background: var(--medio-velo); border-color: var(--medio-linea); color: var(--medio); }
.dist-bajo  { background: var(--bajo-velo);  border-color: var(--bajo-linea);  color: var(--bajo); }
.dist-marca { background: var(--marca-velo); border-color: color-mix(in srgb, var(--marca) 22%, transparent); color: var(--marca); }

/* ── Medidor de tres segmentos ──────────────────────────────────
   Codifica la severidad con forma además de color: tres barras
   llenas, dos o una. Se lee igual en escala de grises. */
.med3 { display: inline-flex; gap: 1.5px; flex: none; }
.med3 i { display: block; width: 3px; height: 10px; border-radius: 1px; background: currentColor; opacity: .2; }
.med3-3 i { opacity: 1; }
.med3-2 i:nth-child(-n+2) { opacity: 1; }
.med3-1 i:nth-child(1) { opacity: 1; }

/* ── Rejilla de evidencias ──────────────────────────────────────
   La pieza central. Competencias en filas, evidencias en columnas:
   cada celda es un indicador observable con su puntaje. */
.rejilla-caja { overflow-x: auto; }
.rejilla {
  display: grid;
  grid-template-columns: minmax(178px, 1.5fr) repeat(3, minmax(104px, 1fr)) 104px;
  gap: 4px;
  min-width: 660px;
}
.rej-cab { padding: 0 4px 8px; }
.rej-fila { display: contents; }
.rej-fila:hover .cel { border-color: var(--linea-2); }
.rej-tit {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 10px 10px 2px; min-width: 0;
}
.rej-tit b { font-family: "Geist Mono", monospace; font-size: .75rem; font-weight: 500; color: var(--tinta-3); flex: none; }
.rej-tit span { font-size: .8125rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.cel {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 11px; border-radius: 7px;
  border: 1px solid var(--linea); background: var(--panel-2);
  cursor: default; transition: border-color .12s, transform .12s;
}
.cel:hover, .cel:focus-visible { transform: translateY(-1px); }
.cel-num { font-family: "Geist Mono", monospace; font-size: .8125rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.cel-ok    { background: var(--ok-velo);    border-color: var(--ok-linea);    color: var(--ok); }
.cel-medio { background: var(--medio-velo); border-color: var(--medio-linea); color: var(--medio); }
.cel-bajo  { background: var(--bajo-velo);  border-color: var(--bajo-linea);  color: var(--bajo); }
.cel-nulo  { color: var(--tinta-3); border-style: dashed; background: transparent; }

/* Disenso: un signo, no un matiz. Se ve en blanco y negro y se nombra. */
.cel-dis::before {
  content: "⇄";
  font-size: .75rem; font-weight: 600; color: var(--tinta-2);
  margin-right: -2px;
}

.rej-punt {
  display: flex; align-items: baseline; justify-content: flex-end; gap: 5px;
  padding: 10px 2px 10px 10px;
}
.rej-punt b { font-family: "Geist Mono", monospace; font-size: 1.0625rem; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.rej-punt small { font-size: .6875rem; color: var(--tinta-3); }

.leyenda { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .6875rem; color: var(--tinta-3); }
.leyenda span { display: inline-flex; align-items: center; gap: 5px; }
.leyenda i { width: 9px; height: 9px; border-radius: 2px; border: 1px solid; flex: none; }

/* ── Cifras y barras ────────────────────────────────────────── */
.cifra { font-family: "Geist Mono", monospace; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.03em; line-height: 1; }
.cifra-l { font-size: 1.75rem; }
.cifra-xl { font-size: 2.5rem; }
.cifra small { font-size: .75rem; font-weight: 400; color: var(--tinta-3); letter-spacing: 0; }

.barra { display: flex; gap: 2px; height: 6px; width: 100%; border-radius: 99px; overflow: hidden; background: var(--linea); }
.barra i { display: block; height: 100%; }
.b-bajo { background: var(--bajo) } .b-medio { background: var(--medio) } .b-ok { background: var(--ok) }

/* Métrica: rótulo, cifra y apoyo, siempre en ese orden. */
.metrica { display: flex; flex-direction: column; gap: 6px; min-width: 92px; }

/* ── Pasos de configuración ─────────────────────────────────── */
.paso { display: flex; gap: 14px; padding: 16px 20px; }
.paso + .paso { border-top: 1px solid var(--linea); }
.paso-n {
  width: 22px; height: 22px; border-radius: 6px; flex: none; margin-top: 1px;
  display: grid; place-items: center;
  font-family: "Geist Mono", monospace; font-size: .6875rem; font-weight: 500;
  background: var(--panel-3); color: var(--tinta-3);
}
.paso-listo .paso-n { background: var(--ok-velo); color: var(--ok); border: 1px solid var(--ok-linea); }
.paso-actual { background: var(--panel-2); }
.paso-actual .paso-n { background: var(--tinta); color: var(--panel); }

/* ── Rúbrica del docente ────────────────────────────────────── */
.rub { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.rub button {
  padding: 9px 8px; border-radius: 7px;
  border: 1px solid var(--linea-2); background: var(--panel);
  font-size: .75rem; font-weight: 500; color: var(--tinta-2); cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.rub button:hover { border-color: var(--tinta-3); color: var(--tinta); }
.rub button[data-v="INCIPIENTE"][aria-pressed="true"] { background: var(--bajo-velo);  border-color: var(--bajo);  color: var(--bajo); }
.rub button[data-v="EN_PROCESO"][aria-pressed="true"] { background: var(--medio-velo); border-color: var(--medio); color: var(--medio); }
.rub button[data-v="LOGRADO"][aria-pressed="true"]    { background: var(--ok-velo);    border-color: var(--ok);    color: var(--ok); }

/* ── Indicadores de una competencia ─────────────────────────── */
.ind { display: flex; gap: 14px; padding: 13px 0; }
.ind + .ind { border-top: 1px solid var(--linea); }
.ind-p {
  display: flex; align-items: center; align-self: flex-start; gap: 6px;
  flex: none; width: 58px; padding-top: 3px;
  font-family: "Geist Mono", monospace; font-size: .75rem; font-weight: 500;
  font-variant-numeric: tabular-nums;
}

/* ── Citas de docentes ──────────────────────────────────────── */
.cita { padding-left: 13px; border-left: 2px solid var(--linea-2); }
.cita p:first-child { font-size: .8125rem; color: var(--tinta-2); }

/* ── Movimiento ─────────────────────────────────────────────── */
@keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.entra { animation: entra .32s cubic-bezier(.22,.61,.36,1) backwards; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .cel:hover { transform: none; }
}

/* ── Adaptación ─────────────────────────────────────────────── */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .lateral {
    position: static; height: auto; flex-direction: row; align-items: center;
    gap: 12px; padding: 10px 14px; overflow-x: auto;
    border-right: 0; border-bottom: 1px solid var(--linea);
  }
  .lateral .grupo { flex-direction: row; gap: 2px; }
  .lateral .grupo > .rot, .lateral .marca span, .quien span, .nav .cola { display: none; }
  .lateral-pie { margin: 0; flex-direction: row; }
  .quien { border: 0; margin: 0; padding: 8px 0 8px 9px; }
  .nav { width: auto; white-space: nowrap; }
  .panel-cab { flex-direction: column; align-items: stretch; }
  .panel-cab .crece { min-width: 0; }
  .tabla-sup { padding: 0 16px; }
  .hoja { padding: 20px 16px 72px; }
}

@media print {
  .lateral, .tabla-sup, .btn { display: none !important; }
  .hoja { max-width: none; padding: 0; }
  .panel { break-inside: avoid; }
  body { background: #fff; }
}
</style>

function medidor(sev) {

function distintivo(sev) {

function metrica(rot, cifra, apoyo, color) {

}

function panel(cab, cuerpo, extra = "") {

}

function cabecera(titulo, apoyo, derecha = "") {

          ${distintivo(c.sev)}
          ${c.base !== null && c.score !== null && c.score !== c.base
            ? `<span class="t12 med" style="color:var(--ok)">+${c.score - c.base} vs. línea base</span>` : ""}
          ${c.disenso ? `<span class="dist dist-medio">⇄ Disenso</span>` : ""}
        </div>
        <h3 class="d3" style="margin-top:7px">${c.nom}</h3>
        <p class="apoyo">${c.epg} · ${c.docentes} docente${c.docentes === 1 ? "" : "s"}</p>
      </div>
      <p class="cifra cifra-xl">${c.score === null ? "—" : c.score}<small>/100</small></p>
    </div>

    <div class="panel-cpo" style="padding-top:4px;padding-bottom:8px">
      <ul>
        ${c.ind.map((i) => `
          <li class="ind">
            <span class="ind-p" style="color:var(--${i.sev === "nulo" ? "tinta-3" : i.sev})">
              ${medidor(i.sev)}${i.s === null ? "—" : i.s}
            </span>
            <div class="crece">
              <p class="t13">${esc(i.t)}</p>
              ${(i.com || []).length ? `
                <ul class="pila g10" style="margin-top:10px">
                  ${i.com.map((m) => `
                    <li class="cita">
                      <p>«${esc(m.q)}»</p>
                      <p class="t12 ter" style="margin-top:3px">${esc(m.a)}</p>
                    </li>`).join("")}
                </ul>` : ""}
            </div>
          </li>`).join("")}
      </ul>
    </div>
  </article>`;
}

// ═══════════ Navegación ═══════════
const VISTAS = { panel: vistaPanel, configurar: vistaConfigurar, evaluar: vistaEvaluar, resultados: vistaResultados };
const main = document.getElementById("main");
const miga = document.getElementById("miga");

function ir(id) {
  main.innerHTML = VISTAS[id]();
  miga.innerHTML = MIGAS[id]
    .map((m, i, a) => (i === a.length - 1 ? `<b>${m}</b>` : `${m} <i>/</i>`))
    .join(" ");
  document.querySelectorAll(".nav[data-ir]").forEach((b) =>
    b.setAttribute("aria-current", b.dataset.ir === id ? "page" : "false"));
  window.scrollTo({ top: 0 });
  enganchar();
}

function enganchar() {
  document.querySelectorAll("[data-ir]").forEach((b) => {
    if (b.dataset.listo) return;
    b.dataset.listo = "1";
    b.addEventListener("click", () => ir(b.dataset.ir));
  });

  document.querySelectorAll("[data-rub] button").forEach((b) => {
    b.addEventListener("click", () => {
      b.parentElement.querySelectorAll("button").forEach((o) => o.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
    });
  });

  const guardar = document.getElementById("guardar-eval");
  if (guardar) guardar.addEventListener("click", () => {
    guardar.textContent = "Evaluación guardada";
    guardar.disabled = true;
  });

  const copiar = document.getElementById("copiar");
  if (copiar) copiar.addEventListener("click", () => {
    copiar.textContent = "Copiado";
    setTimeout(() => (copiar.textContent = "Copiar"), 1800);
  });
}

// Tema: tres estados — claro, oscuro del sistema y oscuro elegido.
(function () {
  const raiz = document.documentElement;
  const b = document.getElementById("tema");
  const sol = b.querySelector('[data-i="sol"]');
  const luna = b.querySelector('[data-i="luna"]');
  const oscuro = () => {
    const elegido = raiz.getAttribute("data-theme");
    return elegido ? elegido === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  };
  const pintar = () => { const o = oscuro(); sol.hidden = o; luna.hidden = !o; };
  b.addEventListener("click", () => {
    raiz.setAttribute("data-theme", oscuro() ? "light" : "dark");
    pintar();
  });
  pintar();
})();

ir("resultados");
</script>
