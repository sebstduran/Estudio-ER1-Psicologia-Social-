<title>Instrumento CCAA</title>

<style>
/* ══════════ Sistema ══════════ */
:root {
  /* El lienzo es un neutro cálido; las tarjetas son blancas. Esa diferencia
     es la que da profundidad sin recurrir a sombras pesadas. */
  --lienzo: #f2eeea;
  --carta: #ffffff;
  --carta-2: #faf7f5;
  --rail: #191411;
  --rail-2: #241d18;
  --rail-texto: #cdc2b9;
  --tinta: #191411;
  --suave: #6b6058;
  --tenue: #9a8d84;
  --regla: #e6dfd8;
  --regla-2: #d6ccc3;

  --ua: #8a1515;
  --ua-hondo: #6b0f0f;
  --ua-vivo: #b23a2e;
  --ua-velo: #f9eae8;

  --logrado: #2f7a4f;
  --logrado-velo: #e8f3ec;
  --proceso: #b8790f;
  --proceso-velo: #fbf1e0;
  --incipiente: #c1303c;
  --incipiente-velo: #fbe9ea;

  --sombra: 25 20 17;
}

:root[data-theme="dark"], :root:not([data-theme="light"]) {
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --lienzo: #100d0b;
    --carta: #1b1613;
    --carta-2: #221c18;
    --rail: #0b0908;
    --rail-2: #171210;
    --rail-texto: #b3a79e;
    --tinta: #f5efe9;
    --suave: #ab9f96;
    --tenue: #7d7169;
    --regla: #322a25;
    --regla-2: #443a33;
    --ua: #e2564c;
    --ua-hondo: #ef7168;
    --ua-vivo: #e2564c;
    --ua-velo: #33201d;
    --logrado-velo: #1b2c21;
    --proceso-velo: #2f2513;
    --incipiente-velo: #35201f;
    --sombra: 0 0 0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --lienzo: #100d0b;
  --carta: #1b1613;
  --carta-2: #221c18;
  --rail: #0b0908;
  --rail-2: #171210;
  --rail-texto: #b3a79e;
  --tinta: #f5efe9;
  --suave: #ab9f96;
  --tenue: #7d7169;
  --regla: #322a25;
  --regla-2: #443a33;
  --ua: #e2564c;
  --ua-hondo: #ef7168;
  --ua-vivo: #e2564c;
  --ua-velo: #33201d;
  --logrado-velo: #1b2c21;
  --proceso-velo: #2f2513;
  --incipiente-velo: #35201f;
  --sombra: 0 0 0;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--lienzo);
  color: var(--tinta);
  font-family: "IBM Plex Sans", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
  line-height: 1.55;
}

h1, h2, h3, h4 { margin: 0; font-family: "Source Serif 4", Georgia, serif; font-weight: 600; text-wrap: balance; letter-spacing: -0.012em; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: inherit; }

.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.serif { font-family: "Source Serif 4", Georgia, serif; }
.rotulo { font-family: "IBM Plex Mono", monospace; font-size: 0.66rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--tenue); }

:where(a, button, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--ua-vivo); outline-offset: 3px; border-radius: 4px;
}

/* ══════════ Estructura ══════════ */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }

.rail {
  background: var(--rail);
  color: var(--rail-texto);
  display: flex; flex-direction: column;
  padding: 20px 16px;
  gap: 26px;
  position: sticky; top: 0; height: 100vh;
  border-right: 1px solid rgb(255 255 255 / 0.05);
}
.rail-marca { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.rail-escudo { width: 34px; height: 34px; border-radius: 8px; background: #fff; padding: 3px; display: grid; place-items: center; }
.rail-escudo img { width: 100%; height: auto; display: block; }
.rail-marca strong { display: block; color: #fff; font-family: "Source Serif 4", serif; font-size: 0.95rem; line-height: 1.15; }
.rail-marca span { font-size: 0.66rem; color: #8a7c73; letter-spacing: 0.06em; }

.rail-grupo { display: flex; flex-direction: column; gap: 2px; }
.rail-grupo > .rotulo { padding: 0 10px 8px; color: #6d615a; }
.rail-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 9px 10px; border-radius: 9px;
  font-size: 0.88rem; text-align: left; color: var(--rail-texto);
  transition: background-color .18s ease, color .18s ease;
}
.rail-btn:hover { background: var(--rail-2); color: #fff; }
.rail-btn[aria-current="page"] { background: var(--ua); color: #fff; }
.rail-btn .n { font-family: "IBM Plex Mono", monospace; font-size: 0.7rem; opacity: .65; }
.rail-btn .punto { width: 6px; height: 6px; border-radius: 99px; margin-left: auto; }

.rail-pie { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 4px; }
.rail-usuario { display: flex; align-items: center; gap: 9px; font-size: 0.8rem; }
.rail-avatar { width: 28px; height: 28px; border-radius: 99px; background: var(--ua); color: #fff; display: grid; place-items: center; font-size: 0.7rem; font-weight: 600; }

.lienzo { min-width: 0; display: flex; flex-direction: column; }

.barra {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 0 32px; height: 60px;
  background: color-mix(in srgb, var(--lienzo) 86%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--regla);
}
.miga { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--suave); }
.miga b { color: var(--tinta); font-weight: 500; }
.miga .sep { color: var(--regla-2); }

.contenido { padding: 34px 32px 80px; max-width: 1180px; width: 100%; }

/* ══════════ Piezas ══════════ */
.carta {
  background: var(--carta);
  border: 1px solid var(--regla);
  border-radius: 16px;
  box-shadow: 0 1px 2px rgb(var(--sombra) / .04), 0 12px 28px -18px rgb(var(--sombra) / .16);
}
.carta.plana { box-shadow: none; }

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 17px; border-radius: 99px;
  font-size: 0.85rem; font-weight: 500;
  transition: background-color .16s ease, box-shadow .16s ease, transform .12s ease, border-color .16s ease;
}
.btn:active { transform: translateY(1px); }
.btn-p { background: var(--ua); color: #fff; box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--ua) 75%, transparent); }
.btn-p:hover { background: var(--ua-hondo); box-shadow: 0 10px 24px -8px color-mix(in srgb, var(--ua) 80%, transparent); }
.btn-s { background: var(--carta); border: 1px solid var(--regla); }
.btn-s:hover { border-color: var(--regla-2); background: var(--carta-2); }
.btn-f { color: var(--suave); }
.btn-f:hover { color: var(--tinta); background: var(--carta-2); }
.btn-sm { padding: 6px 13px; font-size: 0.78rem; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 0.72rem; font-weight: 500; }
.chip-crit { background: var(--incipiente-velo); color: var(--incipiente); }
.chip-riesgo { background: var(--proceso-velo); color: var(--proceso); }
.chip-ok { background: var(--logrado-velo); color: var(--logrado); }
.chip-ua { background: var(--ua-velo); color: var(--ua); }
.chip-neutro { background: var(--carta-2); color: var(--suave); border: 1px solid var(--regla); }

/* Cifra grande: el dato es el protagonista */
.cifra { font-family: "Source Serif 4", serif; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; }
.cifra-xl { font-size: 3.4rem; }
.cifra-l { font-size: 2.1rem; }
.cifra small { font-size: .42em; font-weight: 400; color: var(--tenue); margin-left: 2px; }

.barra-logro { display: flex; height: 8px; gap: 2px; border-radius: 99px; overflow: hidden; background: var(--carta-2); }
.barra-logro i { display: block; height: 100%; transition: width .9s cubic-bezier(.22,1,.36,1); }
.barra-logro i:first-child { border-radius: 99px 0 0 99px; }
.barra-logro i:last-child { border-radius: 0 99px 99px 0; }
.seg-inc { background: var(--incipiente); }
.seg-pro { background: var(--proceso); }
.seg-log { background: var(--logrado); }

/* ══════════ Matriz de evidencias — la pieza central ══════════ */
.matriz-caja { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.matriz { display: grid; min-width: 460px; grid-template-columns: minmax(150px, 1.4fr) repeat(3, 1fr) 84px; gap: 6px; align-items: center; }
.matriz-cab { font-family: "IBM Plex Mono", monospace; font-size: 0.62rem; letter-spacing: .13em; text-transform: uppercase; color: var(--tenue); padding-bottom: 4px; }
.celda {
  position: relative;
  height: 46px; border-radius: 9px;
  display: grid; place-items: center;
  font-family: "IBM Plex Mono", monospace; font-size: 0.78rem; font-weight: 500;
  border: 1px solid transparent;
  transition: transform .16s ease, box-shadow .16s ease;
  cursor: default;
}
.celda:hover { transform: scale(1.045); box-shadow: 0 6px 18px -8px rgb(var(--sombra) / .3); z-index: 3; }
.celda-crit { background: var(--incipiente); color: #fff; }
.celda-riesgo { background: var(--proceso); color: #fff; }
.celda-ok { background: var(--logrado); color: #fff; }
.celda-vacia { background: var(--carta-2); border-color: var(--regla); color: var(--tenue); }
/* El disenso se marca con una esquina, no solo con color */
.celda-disenso::after {
  content: ""; position: absolute; top: 4px; right: 4px;
  width: 0; height: 0; border-style: solid; border-width: 0 9px 9px 0;
  border-color: transparent rgb(255 255 255 / .92) transparent transparent;
  border-radius: 0 2px 0 0;
}
.matriz-fila-tit { font-size: 0.84rem; padding-right: 8px; min-width: 0; }
.matriz-fila-tit b { font-family: "IBM Plex Mono", monospace; font-size: .74rem; color: var(--ua); margin-right: 6px; }
.matriz-punt { text-align: right; font-family: "IBM Plex Mono", monospace; font-size: .84rem; font-weight: 500; }

.leyenda { display: flex; flex-wrap: wrap; gap: 14px; font-size: .74rem; color: var(--suave); }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }
.leyenda i { width: 9px; height: 9px; border-radius: 3px; display: block; }

/* ══════════ Utilidades ══════════ */
.pila { display: flex; flex-direction: column; }
.g6 { gap: 6px } .g10 { gap: 10px } .g14 { gap: 14px } .g18 { gap: 18px } .g26 { gap: 26px }
.fila { display: flex; align-items: center; }
.entre { justify-content: space-between; }
.envuelve { flex-wrap: wrap; }
.crece { flex: 1; min-width: 0; }
.suave { color: var(--suave); }
.tenue { color: var(--tenue); }
.p20 { padding: 20px } .p24 { padding: 24px }
.tsm { font-size: .84rem } .txs { font-size: .76rem }
.regla-arriba { border-top: 1px solid var(--regla); }

.vista { display: none; animation: entra .4s cubic-bezier(.22,1,.36,1) both; }
.vista.on { display: block; }
@keyframes entra { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }

.aparece { opacity: 0; animation: entra .5s cubic-bezier(.22,1,.36,1) forwards; }

/* ══════════ Rúbrica del docente ══════════ */
.rub { display: inline-flex; gap: 7px; flex-wrap: wrap; }
.rub button {
  padding: 7px 14px; border-radius: 99px; border: 1px solid var(--regla);
  font-size: .78rem; font-weight: 500; color: var(--suave);
  transition: all .15s ease;
}
.rub button:hover { border-color: var(--regla-2); }
.rub button[aria-pressed="true"][data-v="INCIPIENTE"] { background: var(--incipiente-velo); border-color: var(--incipiente); color: var(--incipiente); }
.rub button[aria-pressed="true"][data-v="EN_PROCESO"] { background: var(--proceso-velo); border-color: var(--proceso); color: var(--proceso); }
.rub button[aria-pressed="true"][data-v="LOGRADO"] { background: var(--logrado-velo); border-color: var(--logrado); color: var(--logrado); }

/* ══════════ Pasos ══════════ */
.paso { display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding: 20px; border-radius: 16px; border: 1px solid var(--regla); background: var(--carta); }
.paso.actual { border-color: color-mix(in srgb, var(--ua) 42%, transparent); box-shadow: 0 1px 2px rgb(var(--sombra)/.05), 0 14px 30px -18px rgb(var(--sombra)/.2); }
.paso.pendiente { opacity: .5; }
.paso-n { width: 30px; height: 30px; border-radius: 99px; display: grid; place-items: center; font-size: .82rem; font-weight: 600; background: var(--carta-2); color: var(--tenue); }
.paso.listo .paso-n { background: var(--logrado-velo); color: var(--logrado); }
.paso.actual .paso-n { background: var(--ua); color: #fff; }

/* ══════════ Adaptación ══════════ */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail {
    position: static; height: auto; flex-direction: row; align-items: center;
    gap: 14px; overflow-x: auto; padding: 12px 16px;
    border-right: 0; border-bottom: 1px solid rgb(255 255 255 / .06);
  }
  .rail-grupo { flex-direction: row; gap: 6px; }
  .rail-grupo > .rotulo, .rail-pie, .rail-marca span { display: none; }
  .rail-btn { white-space: nowrap; padding: 7px 12px; }
  .rail-btn .punto { display: none; }
  .contenido { padding: 22px 18px 60px; }
  .barra { padding: 0 18px; }
  .matriz { grid-template-columns: minmax(118px, 1.2fr) repeat(3, minmax(62px, 1fr)) 56px; }
  .cifra-xl { font-size: 2.6rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .aparece { opacity: 1; }
}
</style>

<script>
// ════════ Datos del nivel de ejemplo ════════
const COMPS = [
  { cod: "3.1", nom: "Evaluar", epg: "Instrumentos de evaluación", score: 25, sev: "crit", docentes: 2, base: 25,
    ind: [
      { t: "Reconoce los principales enfoques teóricos de evaluación cognitivo-conductual.", s: 25, sev: "crit" },
      { t: "Compara enfoques de evaluación según el fenómeno conductual a comprender.", s: 25, sev: "crit",
        com: [{ q: "Ya identifican los elementos, falta que los relacionen entre sí.", a: "Prof. Matías Herrera · Metodología de la Investigación I" },
              { q: "Confunden los niveles de análisis. Necesitan más práctica guiada antes de trabajar solos.", a: "Prof. Daniela Soto · Bases Biológicas de la Conducta" }] },
      { t: "Integra los enfoques revisados en una comprensión global de un caso o situación.", s: 25, sev: "crit" },
    ],
    asig: [["Metodología de la Investigación I","transversal",50],["Bases Biológicas de la Conducta","directa",0]] },

  { cod: "1.1", nom: "Fundamentar", epg: "Elementos curriculares", score: 50, sev: "riesgo", docentes: 2, base: 0, disenso: 3,
    ind: [
      { t: "Identifica fundamentos psicobiológicos, socioculturales y epistemológicos pertinentes a un problema disciplinar.", s: 50, sev: "riesgo", dis: true,
        com: [{ q: "Cuesta que distingan el fundamento teórico de la opinión personal; en el control la mayoría describió sin fundamentar.", a: "Prof. Daniela Soto · Bases Biológicas de la Conducta" }] },
      { t: "Relaciona esos fundamentos entre sí para construir una explicación coherente del fenómeno psicosocial.", s: 50, sev: "riesgo", dis: true,
        com: [{ q: "La rúbrica compartida con la otra asignatura ayudó: llegaron con el criterio claro.", a: "Prof. Carla Vidal · Psicología del Desarrollo I" }] },
      { t: "Traduce la fundamentación teórica en una propuesta de investigación con preguntas y objetivos claros.", s: 50, sev: "riesgo", dis: true,
        com: [{ q: "Llegan sin la lectura previa hecha, así que la clase se va en cubrir lo mínimo.", a: "Prof. Daniela Soto · Bases Biológicas de la Conducta" }] },
    ],
    asig: [["Psicología del Desarrollo I","directa",100],["Bases Biológicas de la Conducta","transversal",0]] },

  { cod: "2.1", nom: "Investigar", epg: "Estrategias metodológicas", score: 50, sev: "riesgo", docentes: 1, base: 50,
    ind: [
      { t: "Analiza problemas psicosociales relevantes para delimitar un tema de investigación.", s: 50, sev: "riesgo",
        com: [{ q: "Avanzaron respecto del primer trabajo, pero la argumentación sigue siendo descriptiva.", a: "Prof. Matías Herrera · Metodología de la Investigación I" }] },
      { t: "Aplica las etapas del método científico al diseño de su propuesta.", s: 50, sev: "riesgo" },
      { t: "Argumenta la pertinencia y viabilidad del tema propuesto.", s: 50, sev: "riesgo" },
    ],
    asig: [["Metodología de la Investigación I","directa",50]] },

  { cod: "4.1", nom: "Analizar", epg: "Estrategias metodológicas", score: 100, sev: "ok", docentes: 1, base: 0,
    ind: [
      { t: "Describe la conducta humana en estudio desde más de un paradigma biopsicosocial.", s: 100, sev: "ok" },
      { t: "Contrasta críticamente las aproximaciones paradigmáticas utilizadas.", s: 100, sev: "ok" },
      { t: "Elabora conclusiones fundamentadas a partir del análisis realizado.", s: 100, sev: "ok" },
    ],
    asig: [["Psicología del Desarrollo I","directa",100]] },

  { cod: "6.1", nom: "Autoexplorar", epg: "Seguimiento de resultados", score: 100, sev: "ok", docentes: 1, base: 0,
    ind: [
      { t: "Aplica técnicas de autoexploración a su propio desempeño académico y profesional.", s: 100, sev: "ok" },
      { t: "Valora fortalezas y áreas de mejora identificadas en el proceso.", s: 100, sev: "ok" },
      { t: "Define acciones concretas de crecimiento personal y profesional.", s: 100, sev: "ok" },
    ],
    asig: [["Psicología del Desarrollo I","transversal",100]] },

  { cod: "5.1", nom: "Intervenir", epg: "Derivación al SAAC", score: null, sev: "vacia", docentes: 0, base: null,
    ind: [
      { t: "Analiza críticamente la información disponible sobre una necesidad psicosocial.", s: null, sev: "vacia" },
      { t: "Formula objetivos y acciones de un proyecto de intervención pertinente.", s: null, sev: "vacia" },
      { t: "Justifica la propuesta de intervención en función de la necesidad detectada.", s: null, sev: "vacia" },
    ], asig: [] },
];

const GENTE = [
  { n: "Prof. Carla Vidal", a: "Psicología del Desarrollo I", r: 9, e: 9 },
  { n: "Prof. Daniela Soto", a: "Bases Biológicas de la Conducta", r: 6, e: 6 },
  { n: "Prof. Matías Herrera", a: "Metodología de la Investigación I", r: 6, e: 6 },

function tarjetaComp(c) {
  const borde = c.sev === "crit" ? "var(--incipiente)" : c.sev === "riesgo" ? "var(--proceso)" : "var(--logrado)";
  const fondo = c.sev === "crit" ? "background:color-mix(in srgb, var(--incipiente-velo) 55%, var(--carta));" : "";
  const total = c.ind.filter(i => i.s !== null).length || 1;
  const inc = c.ind.filter(i => i.sev === "crit").length / total * 100;
  const pro = c.ind.filter(i => i.sev === "riesgo").length / total * 100;
  const log = c.ind.filter(i => i.sev === "ok").length / total * 100;

  return `
  <article class="carta p24" style="border-left:3px solid ${borde};${fondo}">
    <div class="fila entre envuelve g14" style="align-items:flex-start">
      <div class="crece">
        <div class="fila g10 envuelve">
          <span class="mono txs" style="color:var(--ua);font-weight:500">${c.cod}</span>
          <span class="chip chip-${CLASE[c.sev] === "crit" ? "crit" : CLASE[c.sev] === "riesgo" ? "riesgo" : "ok"}">${NOMBRE_SEV[c.sev]}</span>
          ${c.base !== null && c.score !== null && c.score !== c.base ? `<span class="txs" style="color:var(--logrado);font-weight:500">↑ ${c.score - c.base} pts</span>` : ""}
          ${c.disenso ? `<span class="chip chip-riesgo">⇄ Disenso</span>` : ""}
        </div>
        <h3 style="font-size:1.25rem;margin-top:7px">${c.nom}</h3>
        <p class="txs tenue" style="margin-top:4px">Componente EPG · ${c.epg} · ${c.docentes} docente${c.docentes === 1 ? "" : "s"}</p>
      </div>
      <p class="cifra cifra-xl">${c.score === null ? "—" : c.score}<small>/100</small></p>
    </div>

    <div class="barra-logro" style="margin-top:16px">
      <i class="seg-inc" style="width:${inc}%"></i><i class="seg-pro" style="width:${pro}%"></i><i class="seg-log" style="width:${log}%"></i>
    </div>

    ${c.ind.some(i => i.com) ? `
      <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--regla)">
        <p class="rotulo" style="margin-bottom:10px">Lo que dicen los docentes</p>
        <ul class="pila g10">
          ${c.ind.flatMap(i => (i.com || []).map(m => `
            <li style="border-left:2px solid var(--regla);padding-left:13px">
              <p class="tsm suave" style="font-style:italic">“${esc(m.q)}”</p>
              <p class="txs tenue" style="margin-top:3px">${esc(m.a)}</p>
            </li>`)).join("")}
        </ul>
      </div>` : ""}
  </article>`;
}

const VISTAS = { panel: vistaPanel, configurar: vistaConfigurar, evaluar: vistaEvaluar, resultados: vistaResultados };
const main = document.getElementById("main");
const miga = document.getElementById("miga");

function ir(id) {
  main.innerHTML = `<div class="vista on">${VISTAS[id]()}</div>`;
  miga.innerHTML = MIGAS[id].map((m, i, a) =>
    i === a.length - 1 ? `<b>${m}</b>` : `${m} <span class="sep">/</span>`).join(" ");
  document.querySelectorAll(".rail-btn[data-ir]").forEach((b) =>
    b.setAttribute("aria-current", b.dataset.ir === id ? "page" : "false"));
  window.scrollTo({ top: 0 });
  enganchar();
}

function enganchar() {
  document.querySelectorAll("[data-ir]").forEach((b) => {
    if (b.dataset.enganchado) return;
    b.dataset.enganchado = "1";
    b.addEventListener("click", () => ir(b.dataset.ir));
  });

  // Rúbrica del docente
  document.querySelectorAll("[data-rub] button").forEach((b) => {
    b.addEventListener("click", () => {
      b.parentElement.querySelectorAll("button").forEach((o) => o.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
    });
  });

  const guardar = document.getElementById("guardar-eval");
  if (guardar) guardar.addEventListener("click", () => {
    guardar.textContent = "Evaluación guardada ✓";
    guardar.disabled = true;
    guardar.style.opacity = ".7";
  });

  const copiar = document.getElementById("copiar");
  if (copiar) copiar.addEventListener("click", () => {
    copiar.textContent = "Copiado";
    setTimeout(() => (copiar.textContent = "Copiar"), 1800);
  });
}

// Tema
(function () {
  const raiz = document.documentElement;
  const b = document.getElementById("tema");
  const sol = b.querySelector('[data-i="sol"]'), luna = b.querySelector('[data-i="luna"]');
  const oscuro = () => {
    const e = raiz.getAttribute("data-theme");
    return e ? e === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  };
  const pintar = () => { const o = oscuro(); sol.hidden = o; luna.hidden = !o; };
  b.addEventListener("click", () => { raiz.setAttribute("data-theme", oscuro() ? "light" : "dark"); pintar(); });
  pintar();
})();

ir("resultados");
